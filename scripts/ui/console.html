======================================================================= */
var detailPollMs = 4000;

function renderDetail(runId) {
  app.innerHTML = '<p class="muted">Loading…</p>';
  loadDetail(runId, true);
}

function loadDetail(runId, isFirstLoad) {
  apiJson("/runs/" + encodeURIComponent(runId)).then(function (res) {
    if (currentRoute().runId !== runId) return; // navigated away while in flight
    if (!res.ok) {
      app.innerHTML = '<div class="notice error">Could not load this run (' + res.status + '). ' + escapeHtml(detailText(res.body)) + '</div>';
      mastheadState.hidden = true;
      return;
    }
    var run = res.body;
    updateMastheadState(run);
    var needsRunsForEstimate = run.state === "running" || run.state === "queued";
    if (needsRunsForEstimate) {
      apiJson("/runs").then(function (listRes) {
        renderDetailBody(run, listRes.ok ? listRes.body.runs : []);
        schedulePoll(runId, run.state);
      });
    } else {
      renderDetailBody(run, []);
      schedulePoll(runId, run.state);
    }
  }).catch(function () {
    if (isFirstLoad) app.innerHTML = '<div class="notice error">The request did not reach the server.</div>';
  });
}

/* Human-view label for the masthead's own state indicator: the same short
   phrase used to open nextActionSentenceHuman's bold lead, without the rest
   of the sentence (the masthead has no room for prose, only the label). */
function mastheadHumanLabel(run) {
  var state = run.state, outcome = run.outcome;
  if (state === "queued") return "Waiting to start";
  if (state === "running") return "In progress";
  if (state === "awaiting_approval") return "Paused: needs your decision";
  if (state === "cancelled") return "Cancelled, at your request";
  if (state === "stopped") {
    if (outcome === "succeeded") return "Finished, no problems";
    if (outcome === "governance_stop") return "Stopped on purpose";
    if (outcome === "crashed") return "Stopped by a system fault";
    if (outcome === "timed_out") return "Did not finish in time";
  }
  return "Unknown";
}

function updateMastheadState(run) {
  var tok = stateToken(run.state, run.outcome);
  var label = isHumanView() ? mastheadHumanLabel(run) : tok.label;
  mastheadState.innerHTML = stateDotHtml(tok) + '<span>' + escapeHtml(label) + '</span>';
  mastheadState.className = "masthead-state tone-" + tok.tone;
  mastheadState.hidden = false;
}

function schedulePoll(runId, state) {
  clearPoll();
  var isLive = state === "queued" || state === "running" || state === "awaiting_approval";
  if (!isLive) return;
  pollTimer = setTimeout(function () {
    if (currentRoute().view === "detail" && currentRoute().runId === runId) loadDetail(runId, false);
  }, detailPollMs);
}

function renderDetailBody(run, allRuns) {
  var tok = stateToken(run.state, run.outcome);
  var human = isHumanView();
  var html = "";

  html += '<div class="detail-header">' +
    '<div><h1><a href="#/runs" style="color:var(--quiet-text);text-decoration:none">&larr;</a> ' +
      (human ? runDisplayNameHtml(run, false) : '<span class="mono">' + escapeHtml(run.run_id) + '</span>') +
      '</h1>' +
      '<div class="detail-meta">' + escapeHtml(run.task || "") + (run.review_mode ? " · " + escapeHtml(run.review_mode) : "") +
      (human ? "" : (' · submitted ' + escapeHtml(relativeWhen(run.submitted_at)))) + '</div></div>';
  if (run.state === "queued" || run.state === "running") {
    html += '<button class="button danger" id="cancel-btn">Cancel</button>';
  }
  html += '</div>';

  html += '<div class="status-block">';
  if (!human) {
    html += '<div class="state tone-' + tok.tone + '">' + stateDotHtml(tok) + '<span>' + escapeHtml(tok.label);
    if (run.state === "running" && run.progress) {
      var prog = parseProgress(run.progress);
      var pname = currentPhaseName(prog.phase);
      if (pname) html += ', phase ' + escapeHtml(prog.phase) + ', ' + escapeHtml(pname);
    }
    html += '</span></div>';
  } else {
    html += '<div class="state tone-' + tok.tone + '">' + stateDotHtml(tok) + '<span>' + escapeHtml(mastheadHumanLabel(run)) + '</span></div>';
  }

  if (run.state === "running") {
    html += pairBarHtml(run);
    var est = estimateRemaining(run, allRuns);
    if (est) html += '<p class="muted" style="font-size:0.85rem;margin-top:0.25rem">Estimated remaining: ' + escapeHtml(est) + '</p>';
  }

  /* The raw stop_reason.detail box (including a crash's Python traceback)
     is developer-view only, per CONSOLE_LANGUAGE.md "A crash": the human
     view's next-action sentence below already carries the governance code
     or states plainly that a fault happened, without ever showing the
     traceback, the exit code, or the "view full log" link (those stay
     exactly where they are, in the developer view). */
  if (!human && run.state === "stopped" && run.outcome !== "succeeded" && run.stop_reason) {
    html += '<div class="notice ' + (run.outcome === "governance_stop" ? "warn" : "error") + '" style="margin-top:0.75rem">';
    if (run.outcome === "governance_stop") {
      html += '<strong>' + escapeHtml(run.stop_reason.code || "") + '</strong><br>';
    }
    var raw = run.stop_reason.detail || "";
    var truncated = raw.length > 400 ? raw.slice(0, 400) + "…" : raw;
    html += escapeHtml(truncated);
    if (raw.length > 400) html += ' <a href="#/runs/' + encodeURIComponent(run.run_id) + '" onclick="document.getElementById(\'log-panel\').scrollIntoView()">view full log below</a>';
    html += '</div>';
  }

  if (human) {
    html += '<p class="next-action">' + nextActionSentenceHuman(run) + '</p>';
  } else {
    html += '<p class="next-action">' + escapeHtml(nextActionSentence(run)) + '</p>';
  }
  /* The single partial notice for the whole screen, stated once here rather
     than repeated in Findings and again in Pairing map (a real, reported
     duplication of the same fact). isPartialReview is the same computation
     used below to decide whether to fetch findings/pairs, and this is the
     only place it is rendered as a sentence; loadFindings/loadPairs no
     longer carry their own copy of it. Worded by whether the run is still
     live (running/awaiting_approval: "found so far," since nothing has
     ended yet) or genuinely terminal-but-not-succeeded (crashed, timed out,
     stopped by a rule, cancelled: "found before this run ended"). */
  var isPartialReview = run.state !== "queued" && !(run.state === "stopped" && run.outcome === "succeeded");
  var isLiveState = run.state === "running" || run.state === "awaiting_approval";
  if (isPartialReview) {
    html += '<p class="notice warn" style="margin-top:0.6rem">' + escapeHtml(
      isLiveState
        ? (human ? "Anything found or paired below was found so far, not a complete review yet." : "Partial: found so far, this run is still in progress. Not a complete review.")
        : (human ? "Anything found or paired below was found before this run ended. This is not a complete review." : "Partial: found before this run ended (not stopped/succeeded). Not a complete review.")
    ) + '</p>';
  }
  html += '</div>'; // status-block

  /* awaiting_approval included: the server derives it from status:"running"
     with a pending approval on top (_state_for_job, server.py), so
     run.progress is populated exactly as it is for "running" and was
     already being sent; the console simply never rendered it for this
     state. A reviewer deciding Approve/Deny needs to see how far the run
     had gotten before it paused, the same as anyone watching a running run. */
  if (run.state === "running" || run.state === "queued" || run.state === "awaiting_approval") {
    html += '<h2>' + (human ? "Steps" : "Phases") + '</h2>';
    var prog2 = parseProgress(run.progress);
    html += human ? phaseLadderHumanHtml(prog2.phase, run.task) : phaseLadderHtml(prog2.phase);
  }

  if (run.state === "awaiting_approval" && run.pending_approval) {
    html += renderApprovalBlock(run);
  }

  /* The screen follows what this run actually produced: a section with
     nothing in it does not stand as a heading with an apology below (the
     "None finished yet..." message this used to show for every empty
     state, including queued, where saying anything about documents at all
     is premature). Documents simply is not there until there is at least
     one. Same rule for Archive just below: rendered only when at least one
     document has reached done (renderArchiveSection's own anyDone check),
     never a heading over "nothing to download yet." Same in both views:
     presence never differs, only wording. */
  if (run.documents && run.documents.length) {
    html += '<h2>Documents</h2>';
    html += renderDocuments(run);
  }

  var anyDone = (run.documents || []).some(function (d) { return d.status === "done"; });
  if (anyDone) {
    html += renderArchiveSection(run);
  }

  app.innerHTML = html;

  /* Findings and the pairing map are fetched whenever they COULD exist, not
     only on a clean succeeded completion. The server writes both the moment
     phase 5.5 pairs a unit (_bus_findings/_pairing_map, server.py), with no
     state/outcome gate of its own; a run that later crashes, times out, is
     stopped by a rule, is cancelled, or is still running/paused with one
     document already finished, can carry real findings from before whatever
     happened. Fetching only on state===stopped/outcome===succeeded silently
     hid that data on every other outcome: the system found something, wrote
     it down, and the interface never asked. queued is the one state this
     genuinely cannot apply to (nothing has run yet). isPartialReview is the
     SAME computation the status block already made above, reused, not
     recomputed a second time. */
  if (run.state !== "queued") {
    loadFindings(run.run_id, isPartialReview);
    loadPairs(run.run_id, isPartialReview);
  }
  /* Log renders in every state, per the operator's own instruction: whether
     a log exists is information the reader wants regardless of state, not
     only once a run is terminal. A queued run has has_log:false by
     construction (nothing has run yet); the section still appears and
     states that plainly, the same one-line absence statement every other
     logless run gets, rather than the section simply not existing yet. */
  var logHolder = document.createElement("div");
  logHolder.id = "log-panel-holder";
  app.appendChild(logHolder);
  renderLogPanel(run, logHolder);

  var cancelBtn = document.getElementById("cancel-btn");
  if (cancelBtn) cancelBtn.addEventListener("click", function () { confirmCancel(run.run_id); });

  var approveBtn = document.getElementById("approval-approve");
  var denyBtn = document.getElementById("approval-deny");
  if (approveBtn) approveBtn.addEventListener("click", function () { answerApproval(run.run_id, "APPROVE"); });
  if (denyBtn) denyBtn.addEventListener("click", function () { answerApproval(run.run_id, "DENY"); });
}

function renderApprovalBlock(run) {
  var pa = run.pending_approval;
  var human = isHumanView();
  var html = '<h2>' + (human ? "Paused: needs your decision" : "Awaiting your decision") + '</h2>';
  /* A governed pause with no message and no payload is possible (the server
     does not require either field, _pending_approval_for's own defaults);
     approvalDetailHuman() would then return an empty string and the
     developer branch below an empty <p>, leaving Approve/Deny as two bare
     buttons with nothing above them explaining what is being decided. Named
     plainly instead of silently showing the choice with no basis for it. */
  var hasContent = !!((pa.message || pa.topic) || (pa.payload && Object.keys(pa.payload).length));
  if (!hasContent) {
    html += '<p class="notice warn">' + escapeHtml(
      human
        ? "This run is waiting on a decision, but the system did not record what it needs decided. Check the log before answering; approving or denying blind is not recommended."
        : "No message or payload was recorded for this pending approval (pending_approval.json carries neither). Check the log before answering."
    ) + '</p>';
  } else if (human) {
    /* The payload's raw key/value table is folded into one sentence rather
       than shown as a second, separate block, per CONSOLE_LANGUAGE.md "A
       pending approval": a reviewer deciding Approve/Deny needs to read one
       coherent statement of the disagreement, not reassemble it from a
       table. Nothing is dropped: every payload key still appears, just in
       sentence form; the rule/unit ids stay visible as a small parenthetical.
       approvalDetailHuman(), not nextActionSentenceHuman(): the status box
       above already carries the short "paused, needs your decision" line;
       this is the only place the full detail appears. */
    html += '<p class="approval-message">' + approvalDetailHuman(run) + '</p>';
  } else {
    html += '<p class="approval-message">' + escapeHtml(pa.message || pa.topic || "") + '</p>';
    if (pa.payload && Object.keys(pa.payload).length) {
      html += '<table class="kv-table">' + Object.keys(pa.payload).filter(function (k) { return k !== "message"; }).map(function (k) {
        return '<tr><td>' + escapeHtml(k) + '</td><td>' + escapeHtml(pa.payload[k]) + '</td></tr>';
      }).join("") + '</table>';
    }
  }
  if (pa.timeout_at) {
    html += '<p class="muted" style="font-size:0.8rem;margin-top:0.5rem">If nobody answers by ' + escapeHtml(new Date(pa.timeout_at).toLocaleString()) + ', this defaults to deferred.</p>';
  }
  html += '<textarea id="approval-rationale" placeholder="rationale (optional)"></textarea>';
  html += '<div class="approval-actions">' +
    '<button class="button" id="approval-approve">Approve</button>' +
    '<button class="button secondary" id="approval-deny">Deny</button>' +
    '<span id="approval-result"></span>' +
    '</div>';
  return html;
}

function answerApproval(runId, decision) {
  var rationale = (document.getElementById("approval-rationale") || {}).value || "";
  var resultEl = document.getElementById("approval-result");
  resultEl.textContent = "Recording…";
  apiJson("/runs/" + encodeURIComponent(runId) + "/approval", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ decision: decision, rationale: rationale })
  }).then(function (res) {
    if (res.ok) {
      resultEl.textContent = "Recorded. The run has not resumed yet: this page will update once it does.";
      loadDetail(runId, false);
    } else {
      resultEl.textContent = detailText(res.body) + ". Nothing was changed.";
    }
  }).catch(function () { resultEl.textContent = "The request did not reach the server."; });
}

function confirmCancel(runId) {
  var existing = document.getElementById("cancel-confirm");
  if (existing) return;
  var box = document.createElement("div");
  box.id = "cancel-confirm";
  box.className = "notice warn";
  box.innerHTML = "Cancel this run? This stops real work in progress and cannot be undone. " +
    '<button class="button danger" id="cancel-confirm-yes" style="margin-left:0.5rem">Yes, cancel</button> ' +
    '<button class="button secondary" id="cancel-confirm-no">No</button>';
  document.querySelector(".detail-header").insertAdjacentElement("afterend", box);
  document.getElementById("cancel-confirm-no").addEventListener("click", function () { box.remove(); });
  document.getElementById("cancel-confirm-yes").addEventListener("click", function () {
    box.textContent = "Cancelling…";
    apiJson("/runs/" + encodeURIComponent(runId) + "/cancel", { method: "POST" }).then(function (res) {
      if (res.ok) { loadDetail(runId, false); }
      else { box.className = "notice error"; box.textContent = detailText(res.body) + ". Nothing was changed."; }
    });
  });
}

/* =======================================================================
   DOCUMENTS + ARCHIVE DOWNLOAD
   deliverables_url is a real route now, not a display string; downloading
   needs the Authorization header, so a plain <a href> cannot carry the
   token: fetch, blob, object URL. See CONSOLE_PLAN.md.
======================================================================= */
function renderDocuments(run) {
  return run.documents.map(function (d) {
    var statusText = d.status === "done" ? "done" : "in progress";
    var action = d.status === "done"
      ? '<button class="button secondary" data-download="' + escapeHtml(d.deliverables_url) + '" data-name="' + escapeHtml(d.doc_id) + '.zip">Download</button>'
      : '<span class="muted">.</span>';
    return '<div class="doc-row"><span class="doc-id">' + escapeHtml(d.doc_id) + '</span>' +
      '<span class="muted">' + statusText + '</span>' + action + '</div>';
  }).join("") + attachDownloadHandlers();
}

function attachDownloadHandlers() {
  setTimeout(function () {
    document.querySelectorAll("[data-download]").forEach(function (btn) {
      if (btn._wired) return;
      btn._wired = true;
      btn.addEventListener("click", function () {
        downloadWithToken(btn.getAttribute("data-download"), btn.getAttribute("data-name"), btn);
      });
    });
  }, 0);
  return "";
}

function downloadWithToken(url, filename, btn) {
  var original = btn.textContent;
  btn.textContent = "Downloading…";
  btn.disabled = true;
  api(url).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    var partialHeader = r.headers.get("x-shimmer-partial");
    return r.blob().then(function (blob) { return { blob: blob, partial: partialHeader }; });
  }).then(function (res) {
    var a = document.createElement("a");
    var objUrl = URL.createObjectURL(res.blob);
    a.href = objUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(objUrl); }, 4000);
    btn.textContent = original;
    btn.disabled = false;
  }).catch(function () {
    btn.textContent = "Failed, retry";
    btn.disabled = false;
  });
}

/* Called only when the caller (renderDetailBody) has already confirmed at
   least one document is done: GET /runs/{run_id}/deliverables 404s outright
   when nothing exists under deliverables/ yet (server.py's own check), so a
   button offered with nothing done would point at a download that fails.
   The section itself does not render at all when that is the case (dropped
   by the caller), rather than rendering a heading over an empty-state
   message: whatever exists is shown, and nothing does not get a heading. */
function renderArchiveSection(run) {
  var isPartial = !(run.state === "stopped" && run.outcome === "succeeded");
  var human = isHumanView();
  var label, noteText;
  if (human) {
    label = isPartial ? "Download what's finished so far." : "Download full archive";
    noteText = isPartial ? "This review did not complete, so some documents may be missing from this download." : "";
  } else {
    label = isPartial ? "Download partial archive" : "Download full archive";
    noteText = isPartial ? "This run did not finish successfully: the archive contains only the documents that completed." : "";
  }
  var note = noteText ? '<p class="muted" style="font-size:0.8rem;margin-top:0.4rem">' + escapeHtml(noteText) + '</p>' : "";
  return '<h2>Archive</h2>' +
    '<button class="button secondary" data-download="/runs/' + encodeURIComponent(run.run_id) + '/deliverables" data-name="' + encodeURIComponent(run.run_id) + '_deliverables.zip">' + escapeHtml(label) + '</button>' +
    note + attachDownloadHandlers();
}

/* =======================================================================
   HUMAN VIEW: findings, one sentence per relation. See
   docs/api/CONSOLE_LANGUAGE.md "Findings, one per relation". Built from the
   real Finding record fields (value_a/unit_a/value_b/unit_b/relation/
   record_verdict/rule_id/source_rule_id/unit_id/field_label/delta/
   band_distance_change/explanation), never from the "Article N" phrasing,
   which docs/api/CONSOLE_LANGUAGE.md's own note says was illustrative
   example prose, not literal: this console has no article-lookup route, so
   `unit_id` (e.g. "u01") stands in, per the document's own instruction not
   to invent an article-name lookup that does not exist in the API.
======================================================================= */
function figText(value, unit) {
  var v = (value === undefined || value === null) ? "" : String(value);
  return unit ? (v + " " + unit) : v;
}

/* =======================================================================
   CLICKABLE RULE IDENTIFIERS
   Every rule id shown anywhere (a finding's citation, the developer
   findings table, a pairing-map chip) opens the rule's own text as the
   operator wrote it, GET /rules/{rule_id}. An inline expanding panel
   directly under the clicked id (the same pattern "Show more" already uses
   on a long explanation), not a new page: the identifier is already in
   view and a full navigation away would lose the reader's place.
======================================================================= */
var _ruleLinkSeq = 0;

/* rawId: the id to actually query the server with (whichever this record
   happens to carry, registry or operator's own; the route matches either).
   shownId: the text already decided for display (source_rule_id when known,
   rawId as the only honest fallback), unaffected by this change: this
   function only adds a click target around text already chosen elsewhere. */
function ruleLinkHtml(rawId, shownId) {
  if (!rawId) return escapeHtml(shownId || "");
  _ruleLinkSeq += 1;
  var linkId = "rule-link-" + _ruleLinkSeq;
  return '<a href="#" class="rule-link" id="' + linkId + '" data-rule-id="' + escapeHtml(rawId) + '">' +
    escapeHtml(shownId || rawId) + '</a><span class="rule-panel" id="' + linkId + '-panel" hidden></span>';
}

function wireRuleLinks(scope) {
  (scope || document).querySelectorAll(".rule-link").forEach(function (a) {
    if (a._wired) return;
    a._wired = true;
    a.addEventListener("click", function (e) {
      e.preventDefault();
      var panel = document.getElementById(a.id + "-panel");
      if (!panel) return;
      if (!panel.hidden) { panel.hidden = true; return; }
      panel.hidden = false;
      if (panel._loaded) return;
      panel._loaded = true;
      panel.innerHTML = '<span class="muted">Loading…</span>';
      apiJson("/rules/" + encodeURIComponent(a.getAttribute("data-rule-id"))).then(function (res) {
        if (!res.ok) {
          panel.innerHTML = '<div class="notice warn">' + escapeHtml(
            isHumanView()
              ? "This rule's own text is not available: " + detailText(res.body) + "."
              : detailText(res.body)
          ) + '</div>';
          return;
        }
        var r = res.body;
        var shown = r.source_rule_id || r.id || "";
        panel.innerHTML = '<div class="rule-panel-body">' +
          '<div class="rule-panel-head"><span class="mono">' + escapeHtml(shown) + '</span>' +
          (r.severity ? ' <span class="muted">' + escapeHtml(r.severity) + '</span>' : '') + '</div>' +
          '<p>' + escapeHtml(r.rule || "") + '</p>' +
          '</div>';
      });
    });
  });
}

function findingRuleParen(f, extra) {
  var shown = f.source_rule_id || f.rule_id || "";
  var parts = [];
  if (shown) parts.push(ruleLinkHtml(f.rule_id, shown));
  if (f.unit_id) parts.push(escapeHtml(f.unit_id));
  var text = parts.join(" · "); // middot, per CONSOLE_LANGUAGE.md ("use middot, not em dash")
  if (extra) text += ', "' + escapeHtml(extra) + '"';
  return mutedParenHtml(text);
}

function findingPriorParen(f) {
  var id = f.unit_id || "";
  return mutedParen((id ? id + ", " : "") + "compared to the earlier version");
}

/* One relation -> one human sentence, exactly per CONSOLE_LANGUAGE.md's
   templates. A relation this table does not recognise (should not happen;
   the schema names exactly 13) falls through to a plain, honest restatement
   of the developer row rather than silently showing nothing. */
function findingSentenceHtml(f) {
  var a = figText(f.value_a, f.unit_a);
  var b = figText(f.value_b, f.unit_b);
  var rel = f.relation;
  var irregular = f.record_verdict === "irregular";

  if (rel === "sum_mismatch") {
    /* sum_mismatch is one of the few relations that can be EITHER verdict
       (most others, above_band etc., only ever fire when something is
       wrong): docs/api/CONSOLE_LANGUAGE.md's own approved template only
       ever specified the ok case, "The total checks out," which this
       branch used to return unconditionally, mislabeling a real
       mismatch as agreement. Found while verifying the amendments pass
       against a fixture that finally exercised sum_mismatch+irregular
       together; fixed here rather than left, per the same rule this whole
       pass has followed for every other defect found along the way. */
    if (irregular) {
      return '<strong>The total does not check out.</strong> The stated total, ' + escapeHtml(a) +
        ', does not match what its parts add up to, ' + escapeHtml(b) + '. ' +
        findingRuleParen(f, "irregular");
    }
    return '<strong>The total checks out.</strong> The stated total, ' + escapeHtml(a) +
      ', matches what its parts add up to, ' + escapeHtml(b) + ', within the tolerance the rule allows. ' +
      findingRuleParen(f);
  }
  if (rel === "above_band") {
    return '<strong>This figure is higher than the reference table allows.</strong> The document states ' + escapeHtml(a) +
      '. The reference table\'s upper bound for this category is ' + escapeHtml(b) + '. ' +
      findingRuleParen(f, "irregular");
  }
  if (rel === "below_band") {
    return '<strong>This figure is lower than the reference table allows.</strong> The document states ' + escapeHtml(a) +
      '. The reference table\'s lower bound for this category is ' + escapeHtml(b) + '. ' +
      findingRuleParen(f, "irregular");
  }
  if (rel === "missing_field") {
    return '<strong>Something the rule requires is missing.</strong> The document does not state a required value, and the rule requires one. ' +
      findingRuleParen(f, "irregular");
  }
  if (rel === "product_mismatch") {
    /* Bidirectional, same class of fix as sum_mismatch above:
       paired_review.py's own product_mismatch check carries "agrees":
       _close(computed, vc), ok when the arithmetic matches. */
    if (irregular) {
      return '<strong>The stated total doesn\'t match the calculation behind it.</strong> The document states a total of ' + escapeHtml(a) +
        '. Quantity times unit price works out to ' + escapeHtml(b) + '. ' +
        findingRuleParen(f, "irregular");
    }
    return '<strong>The stated total matches the calculation behind it.</strong> The document states a total of ' + escapeHtml(a) +
      '. Quantity times unit price works out to ' + escapeHtml(b) + ', within the tolerance the rule allows. ' +
      findingRuleParen(f);
  }
  if (rel === "ratio_out_of_range") {
    /* Bidirectional: paired_review.py assigns this SAME relation name for a
       ratio that IS in range (agrees=True, "in range is still computed" so
       the pair counts as settled rather than sent to a model), not only for
       one that is out of range. The relation's own name names the CHECK,
       not always its outcome; the verdict says which way it went. */
    if (irregular) {
      return '<strong>This ratio is outside the range the rule allows.</strong> The document states a ratio of ' + escapeHtml(a) +
        '. The rule permits ' + escapeHtml(b) + '. ' +
        findingRuleParen(f, "irregular");
    }
    return '<strong>This ratio is within the range the rule allows.</strong> The document states a ratio of ' + escapeHtml(a) +
      '. The rule permits ' + escapeHtml(b) + '. ' +
      findingRuleParen(f);
  }
  if (rel === "date_window") {
    return '<strong>This date is outside the window the rule requires.</strong> The document states ' + escapeHtml(a) +
      '. The rule requires ' + escapeHtml(b) + '. ' +
      findingRuleParen(f, "irregular");
  }
  if (rel === "licence_missing") {
    /* Worded generically ("a required reference"), never the specific term
       this relation's own schema NAME uses: config/domain_vocabulary.json
       keeps that term out of the code surface at fail severity, on purpose,
       so no single operator's domain concept gets baked into generic UI
       copy. The relation id itself is unaffected (it is the schema's own
       name, config/agent_contracts.json, structurally exempt from that
       scan's word-boundary match): an operator whose rule concerns that
       specific kind of document still reads their own wording here, since
       the rule's own text, cited in the parenthetical, is theirs, not this
       file's. */
    return '<strong>A reference this rule requires is missing.</strong> This unit needs an accompanying reference or citation that this rule requires, and none is present. ' +
      findingRuleParen(f, "irregular");
  }
  if (rel === "changed_from_prior") {
    var label = f.field_label || "this field";
    return '<strong>This changed since the earlier draft.</strong> The ' + escapeHtml(label) + ' was ' + escapeHtml(b) +
      '; this version states ' + escapeHtml(a) + (f.delta ? (", a change of " + escapeHtml(String(f.delta))) : "") +
      '. This is not a problem, only a change worth knowing about. ' + findingPriorParen(f);
  }
  if (rel === "unchanged_from_prior") {
    var label2 = f.field_label || "this field";
    return '<strong>This is unchanged since the earlier draft.</strong> The ' + escapeHtml(label2) + ' was ' + escapeHtml(b) + ' and still is. ' +
      findingPriorParen(f);
  }
  if (rel === "moved_toward") {
    var label3 = f.field_label || "this field";
    return '<strong>This moved closer to what the reference table allows.</strong> The ' + escapeHtml(label3) + ' was ' + escapeHtml(b) +
      ', now ' + escapeHtml(a) + (f.band_distance_change ? (": " + escapeHtml(String(f.band_distance_change)) + " closer to the band the rule states") : ", closer to the band the rule states") +
      '. ' + findingPriorParen(f);
  }
  if (rel === "moved_away") {
    var label4 = f.field_label || "this field";
    return '<strong>This moved further from what the reference table allows.</strong> The ' + escapeHtml(label4) + ' was ' + escapeHtml(b) +
      ', now ' + escapeHtml(a) + (f.band_distance_change ? (": " + escapeHtml(String(f.band_distance_change)) + " further from the band the rule states") : ", further from the band the rule states") +
      '. This is not flagged as irregular by itself; it is a direction worth watching. ' + findingPriorParen(f);
  }
  if (rel === "absent_since_prior") {
    var label5 = f.field_label || "this field";
    return '<strong>This is no longer in the document.</strong> The earlier version stated a ' + escapeHtml(label5) + ' of ' + escapeHtml(b) +
      '. The current version does not state one at all. ' + findingPriorParen(f);
  }
  /* Unrecognised relation: an honest restatement of the developer row,
     never a blank space, since the human view must never drop a fact the
     developer view shows. */
  return '<strong>' + escapeHtml(rel || "Finding") + (irregular ? " (irregular)" : "") + '.</strong> ' +
    escapeHtml(f.explanation || "") + " " + escapeHtml(a) + " / " + escapeHtml(b) + " " + findingRuleParen(f);
}

/* =======================================================================
   AMENDMENTS: a proposed correction, shown directly under its own finding.
   The operator's own requirement: the passage as it stands, the passage as
   proposed, the rule in the operator's own id, and the reasoning, TOGETHER,
   never any one of the four alone, since an unexplained correction is worth
   less than an explained one and a reader must be able to tell them apart.
   Both views carry the same four facts; only the wording differs, per the
   rule already settled for every other section on this surface.
======================================================================= */
function amendmentOriginalHtml(a, human) {
  /* original_text_is_passage is false for more than one reason, and this
     view cannot tell which: a run produced before the source fix in
     paired_review.py's amendment_from_finding (the bare unit id sitting in
     an old run's own review_data.json), a run made AFTER that fix where the
     finding's own unit_id still did not match any unit the document was
     split into (found on a real run: a wide-mode agent stating its own
     finding's unit_id as the document's own identifier for the record, not
     the pipeline's internal split id), or the server genuinely has nothing
     (empty original_text). The wording says only what is true in every
     case: the passage was not carried, not why, since guessing a cause
     this view cannot verify would be its own kind of overclaiming. */
  if (a.original_text_is_passage && a.original_text) {
    return escapeHtml(a.original_text);
  }
  var note = human
    ? "The original wording was not recorded for this amendment."
    : "original_text not a passage (raw value: " + (a.original_text || "(empty)") + ")";
  return '<span class="muted">' + escapeHtml(note) + '</span>';
}

function amendmentRepairNoteHtml(a, human) {
  /* unit_id_repaired_to is present only when amendment_from_finding's
     boundary repair fired and found exactly one unambiguous match: the
     passage shown above came from that lookup, not a direct one. Shown as a
     quiet fact, not a warning, since a fired-and-resolved repair is the
     mechanism working, not a problem; absent entirely when the repair never
     fired (the common case, and the intended common case once the contract
     and payload fix land). */
  if (!a.unit_id_repaired_to) return "";
  var note = human
    ? "Matched to unit " + a.unit_id_repaired_to + " by content, the finding's own unit id did not match directly."
    : "unit_id_repaired_to: " + a.unit_id_repaired_to + " (finding_unit_id did not match a unit directly; resolved by content match)";
  return '<p class="amendment-repair-note">' + escapeHtml(note) + '</p>';
}

function amendmentHumanHtml(a) {
  var proposed = a.proposed_text
    ? escapeHtml(a.proposed_text)
    : '<span class="muted">No proposed wording was given for this correction.</span>';
  var reasoning = a.comment
    ? escapeHtml(a.comment)
    : '<span class="muted">No reasoning was recorded for this proposal.</span>';
  var ruleShown = a.source_rule_id || a.convention_ref || "";
  return '<div class="amendment-block">' +
    '<p class="amendment-label">Proposed correction ' + (ruleShown ? ruleLinkHtml(a.convention_ref, ruleShown) : "") + '</p>' +
    '<p><span class="amendment-field-label">As it stands:</span> ' + amendmentOriginalHtml(a, true) + '</p>' +
    amendmentRepairNoteHtml(a, true) +
    '<p><span class="amendment-field-label">Proposed:</span> ' + proposed + '</p>' +
    '<p><span class="amendment-field-label">Why:</span> ' + reasoning + '</p>' +
    '</div>';
}

function amendmentDeveloperHtml(a) {
  var proposed = a.proposed_text
    ? escapeHtml(a.proposed_text)
    : '<span class="muted">proposed_text: null</span>';
  var reasoning = a.comment
    ? escapeHtml(a.comment)
    : '<span class="muted">comment: empty</span>';
  var ruleShown = a.source_rule_id || a.convention_ref || "";
  return '<div class="amendment-block">' +
    '<p class="amendment-label mono">amendment ' + (ruleShown ? ruleLinkHtml(a.convention_ref, ruleShown) : "") + '</p>' +
    '<p><span class="amendment-field-label">original_text:</span> ' + amendmentOriginalHtml(a, false) + '</p>' +
    amendmentRepairNoteHtml(a, false) +
    '<p><span class="amendment-field-label">proposed_text:</span> ' + proposed + '</p>' +
    '<p><span class="amendment-field-label">comment:</span> ' + reasoning + '</p>' +
    '</div>';
}

/* =======================================================================
   FINDINGS TABLE
======================================================================= */
/* isPartial no longer renders its own notice here (that was a real,
   reported duplication: the same fact stated once in this section and
   again in Pairing map). The single notice for the whole screen is in
   renderDetailBody's status block; this parameter now only decides whether
   this fetch is expected to be incomplete, kept for future callers that may
   need it, unused in the render itself.
   The section follows what the run produced: no heading, nothing, while
   loading or when there are zero findings, rather than a heading over "No
   findings." A reader is not told to look at a section with nothing in it. */
/* Amendments are fetched alongside findings (GET /runs/{run_id}/amendments,
   the same isPartial state this call is already made under) and joined
   client-side by unit_id+rule_id (finding_unit_id/finding_rule_id on the
   amendment side), so each irregular finding's proposed correction renders
   directly under its own row/sentence, never as a separate section: an
   amendment with no finding to attach to (should not happen; every one is
   built from a finding) is silently unshown rather than orphaned on screen. */
function amendmentKey(unitId, ruleId) { return (unitId || "") + "␀" + (ruleId || ""); }

function amendmentRefusalsHtml(refusals, human) {
  /* Disappears when there is nothing to say, same discipline as the
     amendments section: a refusal is real content, not a placeholder, so it
     is rendered only when the bus actually carries at least one. A real,
     irregular finding the pipeline could not act on, named plainly rather
     than left to look identical to "nothing was wrong here." */
  if (!refusals || refusals.length === 0) return "";
  var rows = refusals.map(function (r) {
    var where = [r.unit_id, r.rule_id].filter(Boolean).join(" / ") || r.doc_id || "";
    return human
      ? '<li>' + escapeHtml(where ? where + ": " : "") + escapeHtml(r.reason) +
        (r.explanation ? '<div class="muted">' + escapeHtml(r.explanation) + '</div>' : '') + '</li>'
      : '<li class="mono">' + escapeHtml(where) + ': ' + escapeHtml(r.reason) + '</li>';
  }).join("");
  var heading = human
    ? "Findings the pipeline could not act on (" + refusals.length + ")"
    : "amendment_refusals (" + refusals.length + ")";
  var note = human
    ? "Each of these was a real, irregular finding, but the pipeline could not build a correction from it. Named here rather than left to look the same as a clean document."
    : "Real irregular findings that ensure_amendments_for_findings could not turn into an amendment; see GET /runs/{run_id}/amendment-refusals.";
  return '<h2>' + heading + '</h2><p class="muted">' + escapeHtml(note) + '</p><ul class="amendment-refusals">' + rows + '</ul>';
}

function contractViolationsHtml(violations, human) {
  /* Same disappears-when-empty discipline: a call that failed its contract
     entirely (not even a thin finding came out of it) is real to report,
     never a placeholder. Together with amendmentRefusalsHtml, this closes
     the last gap: whatever a call produced now has exactly one visible
     outcome, a real amendment, a refused finding, or a failed contract. */
  if (!violations || violations.length === 0) return "";
  var rows = violations.map(function (v) {
    var missing = (v.missing_fields || []).join(", ");
    return human
      ? '<li>' + escapeHtml(v.agent || "") + ' produced nothing usable: ' + escapeHtml(missing) + '</li>'
      : '<li class="mono">' + escapeHtml(v.agent || "") + ' (' + escapeHtml(v.model || "") + '): ' + escapeHtml(missing) + '</li>';
  }).join("");
  var heading = human
    ? "Calls that produced nothing usable (" + violations.length + ")"
    : "contract_violations (" + violations.length + ")";
  var note = human
    ? "Each of these calls failed its agent's own contract outright, no finding at all, thin or otherwise, came out of it."
    : "Every CONTRACT_VIOLATION on this run's bus; see GET /runs/{run_id}/contract-violations.";
  return '<h2>' + heading + '</h2><p class="muted">' + escapeHtml(note) + '</p><ul class="amendment-refusals">' + rows + '</ul>';
}

function conventionAssignmentHtml(byRule, human) {
  /* The fourth visible state (night chain W3, once convention assignment
     exists): a rule the assignment could not route anywhere an agent can
     act on it. Same disappears-when-empty discipline as the other three
     (an amendment, a refused finding, a failed contract): shown only when
     at least one rule is genuinely unassigned or assigned to an agent with
     no consuming path today, never a placeholder for the common case
     where every tagged rule routed cleanly. Untagged rules (today's
     default routing, unchanged) are never listed here: they are not a
     problem to surface, only a fact reported once in the BOOT log. */
  var rows = Object.keys(byRule || {}).map(function (id) {
    return Object.assign({ rule_id: id }, byRule[id]);
  }).filter(function (r) {
    return r.status === "unassigned" || r.status === "assigned_no_consumer";
  });
  if (rows.length === 0) return "";
  var items = rows.map(function (r) {
    var subjects = (r.subjects || []).join(", ");
    var why = r.status === "unassigned"
      ? "no agent declares: " + subjects
      : "matched " + (r.agents || []).join(", ") + ", no rule-consuming path today";
    return human
      ? '<li>' + ruleLinkHtml(r.rule_id, r.source_rule_id || r.rule_id) + ': ' + escapeHtml(why) + '</li>'
      : '<li class="mono">' + escapeHtml(r.rule_id) + ' [' + escapeHtml(subjects) + ']: ' + escapeHtml(why) + '</li>';
  }).join("");
  var heading = human
    ? "Rules no agent handles (" + rows.length + ")"
    : "convention_assignment.unassigned (" + rows.length + ")";
  var note = human
    ? "Each of these rules carries a subject tag, but no agent that can act on it declares that subject today. Relabel the rule or add the subject to an agent."
    : "Rules with status unassigned or assigned_no_consumer; see GET /runs/{run_id}/convention-assignment.";
  return '<h2>' + heading + '</h2><p class="muted">' + escapeHtml(note) + '</p><ul class="amendment-refusals">' + items + '</ul>';
}

function conventionDistributionHtml(body, human) {
  /* night chain W8: the distribution from W2, which rules went to which
     agent, and which matched none. Shown for any run whose BOOT computed
     an assignment (rule_count > 0); a run that predates the assignment, or
     loaded no conventions, shows nothing rather than an empty table. The
     untagged rules are counted, not listed per agent: an untagged rule
     goes to every convention-review agent (today's routing, unchanged),
     which is a fact about the rule set, not an assignment. */
  var byRule = body.by_rule || {};
  var byAgent = body.by_agent || {};
  var ruleIds = Object.keys(byRule);
  if (ruleIds.length === 0) return "";
  var untagged = ruleIds.filter(function (id) { return byRule[id].status === "untagged"; });
  var unassigned = ruleIds.filter(function (id) {
    return byRule[id].status === "unassigned" || byRule[id].status === "assigned_no_consumer";
  });
  var agentNames = Object.keys(byAgent).filter(function (a) { return (byAgent[a] || []).length > 0; }).sort();
  var rows = agentNames.map(function (a) {
    var ids = byAgent[a] || [];
    var links = ids.map(function (id) {
      return human ? ruleLinkHtml(id, (byRule[id] || {}).source_rule_id || id) : escapeHtml(id);
    }).join(", ");
    return human
      ? '<li>' + escapeHtml(a) + ' handles ' + ids.length + (ids.length === 1 ? ' rule: ' : ' rules: ') + links + '</li>'
      : '<li class="mono">' + escapeHtml(a) + ': [' + links + ']</li>';
  }).join("");
  if (!rows) {
    rows = human
      ? '<li>No tagged rule reached any agent by its subject.</li>'
      : '<li class="mono">by_agent: every entry empty</li>';
  }
  var heading = human
    ? "Which rules each agent handles (" + ruleIds.length + (ruleIds.length === 1 ? " rule)" : " rules)")
    : "convention_assignment.by_agent (" + ruleIds.length + " rules)";
  var untaggedLine = untagged.length
    ? (human
      ? untagged.length + (untagged.length === 1 ? " rule carries" : " rules carry") + " no subject tag and " + (untagged.length === 1 ? "goes" : "go") + " to every convention checker, as before tagging existed."
      : "untagged=" + untagged.length + " (routed to every convention-review agent; today's default).")
    : (human ? "Every rule carries a subject tag." : "untagged=0.");
  var unassignedLine = unassigned.length
    ? (human ? " " + unassigned.length + (unassigned.length === 1 ? " rule matched" : " rules matched") + " no agent that can act on it (listed below)."
             : " unassigned_or_no_consumer=" + unassigned.length + " (listed below).")
    : "";
  var note = human
    ? "Decided once when the rules were loaded, by comparing each rule's subject tag with the subjects each agent declares. " + untaggedLine + unassignedLine
    : "Computed once at BOOT by convention_assignment.assign_conventions; see GET /runs/{run_id}/convention-assignment. " + untaggedLine + unassignedLine;
  return '<h2>' + heading + '</h2><p class="muted">' + escapeHtml(note) + '</p><ul class="amendment-refusals">' + rows + '</ul>';
}

function notFiringHtml(notFiring, human) {
  /* night chain W3's fourth visible state, an agent that did not fire:
     the convention-review agents the firing gate kept from running on
     this run's assignment (no rule assigned to them and no untagged rule
     to fall back on), as GET /runs/{run_id}/convention-assignment
     computes it through the same function the pipeline's gate uses.
     Disappears when every convention checker ran. */
  if (!notFiring || notFiring.length === 0) return "";
  var items = notFiring.map(function (a) {
    return human
      ? '<li>' + escapeHtml(a) + ' did not run: no rule was assigned to it and no untagged rule remained for it to check.</li>'
      : '<li class="mono">' + escapeHtml(a) + '</li>';
  }).join("");
  var heading = human
    ? "Checkers that did not run (" + notFiring.length + ")"
    : "convention_review.not_firing (" + notFiring.length + ")";
  var note = human
    ? "The review skipped these on purpose, by the firing rule, not by a fault. Tag a rule with a subject they declare and they run next time."
    : "convention_assignment.not_firing_convention_review_agents(assignment): the W3 wide-mode firing gate's own answer (pipeline._convention_review_firing_agents delegates to it).";
  return '<h2>' + heading + '</h2><p class="muted">' + escapeHtml(note) + '</p><ul class="amendment-refusals">' + items + '</ul>';
}

function idleAgentsHtml(idleAgents, human, untaggedCount) {
  /* The mirror of conventionAssignmentHtml: an agent that declares a
     subject but matched zero rules this load, exactly as the server's own
     GET /runs/{run_id}/convention-assignment already computed it
     (idle_agents_summary against the live agent registry). Same
     discipline: shown only when it is genuinely true of at least one
     agent. An agent declaring an empty subjects list (with a
     subjects_note) is never idle in this sense, it was never expected to
     match anything. night W8: the wording no longer says "nothing to
     check" when untagged rules exist, because a convention checker still
     receives every untagged rule; matching no TAGGED rule is the fact. */
  if (!idleAgents || idleAgents.length === 0) return "";
  var untagged = untaggedCount || 0;
  var items = idleAgents.map(function (a) {
    var subs = (a.subjects || []).join(", ");
    return human
      ? '<li>' + escapeHtml(a.agent) + ' matched no tagged rule (declares: ' + escapeHtml(subs) + ')</li>'
      : '<li class="mono">' + escapeHtml(a.agent) + ': [' + escapeHtml(subs) + ']</li>';
  }).join("");
  var heading = human
    ? "Agents no tagged rule reached (" + idleAgents.length + ")"
    : "convention_assignment.agents_with_nothing_assigned (" + idleAgents.length + ")";
  var note = human
    ? "Each of these agents declares a subject, but no rule loaded this run carries a matching tag." +
      (untagged ? " The " + untagged + " untagged " + (untagged === 1 ? "rule" : "rules") + " still reach every convention checker among them." : "")
    : "Agents with a non-empty subjects list whose by_agent entry is empty; see GET /runs/{run_id}/convention-assignment." +
      (untagged ? " untagged=" + untagged + " still routes to the convention-review agents." : "");
  return '<h2>' + heading + '</h2><p class="muted">' + escapeHtml(note) + '</p><ul class="amendment-refusals">' + items + '</ul>';
}

function loadFindings(runId, isPartial) {
  var holder = document.createElement("div");
  holder.id = "findings-holder";
  var refusalHolder = document.createElement("div");
  refusalHolder.id = "amendment-refusals-holder";
  var violationHolder = document.createElement("div");
  violationHolder.id = "contract-violations-holder";
  var distributionHolder = document.createElement("div");
  distributionHolder.id = "convention-distribution-holder";
  var unassignedHolder = document.createElement("div");
  unassignedHolder.id = "convention-unassigned-holder";
  var notFiringHolder = document.createElement("div");
  notFiringHolder.id = "convention-not-firing-holder";
  var idleAgentsHolder = document.createElement("div");
  idleAgentsHolder.id = "convention-idle-agents-holder";
  app.appendChild(holder);
  app.appendChild(refusalHolder);
  app.appendChild(violationHolder);
  app.appendChild(distributionHolder);
  app.appendChild(unassignedHolder);
  app.appendChild(notFiringHolder);
  app.appendChild(idleAgentsHolder);
  apiJson("/runs/" + encodeURIComponent(runId) + "/amendment-refusals").then(function (refRes) {
    refusalHolder.innerHTML = refRes.ok ? amendmentRefusalsHtml(refRes.body.refusals, isHumanView()) : "";
  });
  apiJson("/runs/" + encodeURIComponent(runId) + "/contract-violations").then(function (violRes) {
    violationHolder.innerHTML = violRes.ok ? contractViolationsHtml(violRes.body.violations, isHumanView()) : "";
  });
  apiJson("/runs/" + encodeURIComponent(runId) + "/convention-assignment").then(function (caRes) {
    if (!caRes.ok) {
      distributionHolder.innerHTML = ""; unassignedHolder.innerHTML = "";
      notFiringHolder.innerHTML = ""; idleAgentsHolder.innerHTML = "";
      return;
    }
    distributionHolder.innerHTML = conventionDistributionHtml(caRes.body, isHumanView());
    wireRuleLinks(distributionHolder);
    unassignedHolder.innerHTML = conventionAssignmentHtml(caRes.body.by_rule, isHumanView());
    wireRuleLinks(unassignedHolder);
    notFiringHolder.innerHTML = notFiringHtml(caRes.body.not_firing, isHumanView());
    idleAgentsHolder.innerHTML = idleAgentsHtml(caRes.body.idle_agents, isHumanView(), caRes.body.untagged);
  });
  Promise.all([
    apiJson("/runs/" + encodeURIComponent(runId) + "/findings"),
    apiJson("/runs/" + encodeURIComponent(runId) + "/amendments"),
  ]).then(function (results) {
    var res = results[0], amendRes = results[1];
    if (!res.ok) { holder.innerHTML = '<h2>Findings</h2><div class="notice error">' + escapeHtml(detailText(res.body)) + '</div>'; return; }
    var findings = res.body.findings || [];
    if (findings.length === 0) { holder.innerHTML = ""; return; }
    var byKey = {};
    if (amendRes.ok) {
      (amendRes.body.amendments || []).forEach(function (a) {
        byKey[amendmentKey(a.finding_unit_id, a.finding_rule_id)] = a;
      });
    }
    var heading = '<h2>Findings (' + findings.length + ')</h2>';
    if (isHumanView()) {
      holder.innerHTML = heading +
        '<ul class="findings-human">' + findings.map(function (f) {
          var cls = f.record_verdict === "irregular" ? "irregular" : (f.record_verdict === "ok" ? "ok" : "");
          var amend = byKey[amendmentKey(f.unit_id, f.rule_id)];
          return '<li class="finding-human ' + cls + '">' + findingSentenceHtml(f) +
            (amend ? amendmentHumanHtml(amend) : "") + '</li>';
        }).join("") + '</ul>';
      wireRuleLinks(holder);
      return;
    }
    var rows = findings.map(function (f, i) {
      var cls = f.record_verdict === "irregular" ? "irregular" : (f.record_verdict === "ok" ? "ok" : "");
      var explId = "expl-" + i;
      var explanation = f.explanation || "";
      var long = explanation.length > 140;
      var ruleShown = f.source_rule_id || f.rule_id || "";
      var amend = byKey[amendmentKey(f.unit_id, f.rule_id)];
      return '<tr class="' + cls + '">' +
        '<td class="mono fig">' + ruleLinkHtml(f.rule_id, ruleShown) + '</td>' +
        '<td class="mono fig">' + escapeHtml(f.unit_id || "") + '</td>' +
        '<td>' + escapeHtml(f.relation || "") + '</td>' +
        '<td>' + escapeHtml(f.record_verdict || "") + '</td>' +
        '<td class="fig">' + escapeHtml(f.value_a) + " " + escapeHtml(f.unit_a || "") + " / " + escapeHtml(f.value_b) + " " + escapeHtml(f.unit_b || "") + '</td>' +
        '<td class="explanation">' +
          '<span class="' + (long ? "truncated" : "") + '" id="' + explId + '">' + escapeHtml(explanation) + '</span>' +
          (long ? '<br><button class="expand-toggle" data-target="' + explId + '">Show more</button>' : '') +
          (amend ? amendmentDeveloperHtml(amend) : "") +
        '</td>' +
      '</tr>';
    }).join("");
    holder.innerHTML = heading +
      '<table class="findings"><thead><tr>' +
      '<th>Rule</th><th>Unit</th><th>Relation</th><th>Verdict</th><th>Figures</th><th>Explanation</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
    holder.querySelectorAll(".expand-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var cell = document.getElementById(btn.getAttribute("data-target"));
        cell.classList.remove("truncated");
        btn.remove();
      });
    });
    wireRuleLinks(holder);
  });
}

/* =======================================================================
   PAIRING MAP
======================================================================= */
/* isPartial: same meaning as loadFindings' own parameter, unused in the
   render itself (the single notice for the whole screen is stated once in
   renderDetailBody's status block, not repeated here). Follows what the run
   produced: no heading, nothing, while loading or when there is no map. */
function loadPairs(runId, isPartial) {
  var holder = document.createElement("div");
  holder.id = "pairs-holder";
  app.appendChild(holder);
  apiJson("/runs/" + encodeURIComponent(runId) + "/pairs").then(function (res) {
    if (!res.ok) { holder.innerHTML = '<h2>Pairing map</h2><div class="notice error">' + escapeHtml(detailText(res.body)) + '</div>'; return; }
    var docs = res.body.documents || [];
    if (docs.length === 0) { holder.innerHTML = ""; return; }
    /* A pairing-map rule chip now shows the operator's own id
       (source_rule_id, wired server-side in _pairs_view), the same
       identifier findings already show for the identical rule, rather than
       the bare registry number: before this fix a finding cited CONV-A02
       and the pairing map cited CONV-001 for the SAME rule on the SAME
       screen. Clickable, same as a finding's citation (ruleLinkHtml). */
    function chipHtml(p, extraClass, titlePrefix) {
      var shown = p.source_rule_id || p.rule_id || "";
      var title = (titlePrefix ? titlePrefix + ": " : "") + (p.reason || "");
      return '<span class="rule-chip' + (extraClass ? " " + extraClass : "") + '" title="' + escapeHtml(title) + '">' +
        ruleLinkHtml(p.rule_id, shown) + '</span>';
    }
    holder.innerHTML = '<h2>Pairing map</h2>' + docs.map(function (d) {
      var units = (d.units || []).map(function (u) {
        return '<div class="pairs-unit">' +
          '<span class="uid">' + escapeHtml(u.unit_id) + '</span> (' + escapeHtml(u.kind || "") + ')<br>' +
          (u.paired || []).map(function (p) { return chipHtml(p, "", ""); }).join("") +
          (u.rejected || []).map(function (p) { return chipHtml(p, "muted", "rejected"); }).join("") +
        '</div>';
      }).join("");
      return '<details class="pairs-doc"><summary>' + escapeHtml(d.document_id) + ': ' + d.pair_count + ' paired, ' + d.rejected_count + ' rejected, ' + d.undecided_count + ' undecided</summary>' +
        '<div class="pairs-body">' + units + '</div></details>';
    }).join("");
    wireRuleLinks(holder);
  });
}

/* =======================================================================
   LOG VIEWER
   Whether a log exists is known up front from run.has_log (server.py's own
   is_file() check, sent on every GET /runs/{run_id}), never discovered only
   by clicking and reading a status code. This is a deliberate exception to
   "a section disappears when it is empty": the Log heading always renders,
   in both views, because the absence itself is the information a reader
   following "see the log" from a crash or governance-stop sentence needs,
   stated plainly rather than left to a click that might reveal nothing. A
   button is offered ONLY when has_log is true; when false, the one-line
   absence statement replaces it, no button, since nothing would load.
======================================================================= */
function renderLogPanel(run, holder) {
  var runId = run.run_id;
  if (!run.has_log) {
    holder.innerHTML = '<h2 id="log-panel">Log</h2><p class="muted">' +
      escapeHtml("There is no log for this run.") + '</p>';
    return;
  }
  holder.innerHTML = '<h2 id="log-panel">Log</h2><button class="button secondary" id="log-load">Load log</button><div id="log-body"></div>';
  // Uses api() (the raw fetch wrapper), not apiJson(): the log route returns
  // text/plain, not JSON. On failure, detailText() reads the server's own
  // reason (the same helper every other failure path on this surface uses)
  // rather than a bare status code; has_log already ruled out the common
  // "no log" 404 above, so a failure here is a genuine, less expected one
  // (e.g. the file was rotated or removed between the record and the click).
  document.getElementById("log-load").addEventListener("click", function () {
    var body = document.getElementById("log-body");
    body.innerHTML = '<p class="muted">Loading…</p>';
    api("/runs/" + encodeURIComponent(runId) + "/log").then(function (r) {
      if (!r.ok) {
        return r.json().catch(function () { return {}; }).then(function (json) {
          body.innerHTML = '<div class="notice error">' + escapeHtml(detailText(json)) + '</div>';
        });
      }
      return r.text().then(function (text) {
        var lines = text.split("\n");
        var shown = lines.length > 400 ? lines.slice(-400).join("\n") : text;
        body.innerHTML = (lines.length > 400 ? '<p class="muted" style="font-size:0.8rem">Showing the last 400 of ' + lines.length + ' lines.</p>' : "") +
          '<div class="log-box">' + escapeHtml(shown) + '</div>';
      });
    });
  });
}

})();
</script>
</body>
</html>
