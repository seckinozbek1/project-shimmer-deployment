<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Shimmer: Review desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ---------------------------------------------------------------------
   FONTS: vendored, not system. See docs/api/CONSOLE_PLAN.md.
   Public Sans 2.001, SIL Open Font License 1.1 (+ GSA CC0 modifications).
   License text: scripts/ui/fonts/PublicSans-LICENSE.md
--------------------------------------------------------------------- */
@font-face {
  font-family: "Public Sans";
  src: url("fonts/PublicSans-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Public Sans";
  src: url("fonts/PublicSans-SemiBold.woff2") format("woff2");
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}

/* ---------------------------------------------------------------------
   TOKENS: six named hues, two structural. See docs/api/CONSOLE_PLAN.md
   "The palette (revised: six total, not nine)".
--------------------------------------------------------------------- */
:root {
  --ink: #1C1B1F;
  --paper: #FBFAF8;
  --periwinkle: #5E7AA0;
  --mint: #4B8272;
  --peach: #B8804A;
  --rose: #A8495A;

  /* Computed neutrals, derived from --ink, not separately chosen hexes. */
  --hairline: rgba(28, 27, 31, 0.14);
  --hairline-strong: rgba(28, 27, 31, 0.26);
  --quiet-text: rgba(28, 27, 31, 0.55);
  --quiet-fill: rgba(28, 27, 31, 0.08);

  --masthead-bg: #141318;
  --masthead-text: #EDEAE3;
  --masthead-hairline: rgba(237, 234, 227, 0.16);

  --font-ui: "Public Sans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;

  --measure: 46rem;
  --grid-gap: 1px;
}

* { box-sizing: border-box; }

html { color-scheme: light; }

html, body {
  max-width: 100%;
  overflow-x: hidden;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--ink); }
a:not(.button) { text-decoration-thickness: 1px; text-underline-offset: 2px; }

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--periwinkle);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------------------------------------------------------------------
   MASTHEAD: dark band, constant across every view. See CONSOLE_PLAN.md
   "Layout concept (revised: a dark masthead over a light working surface)".
--------------------------------------------------------------------- */
.masthead {
  background: var(--masthead-bg);
  color: var(--masthead-text);
  border-bottom: 1px solid var(--masthead-hairline);
}
.masthead-inner {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 0.85rem 1.25rem;
}
.masthead-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
}
.masthead-name {
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.02em;
  margin: 0;
}
.masthead-state {
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--masthead-text);
  opacity: 0.92;
}
.masthead-right {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  flex-wrap: wrap;
}
.masthead-token-link {
  font-size: 0.8rem;
  white-space: nowrap;
  text-decoration: none;
  border-bottom: 1px solid transparent;
}
.masthead-token-link:hover { border-bottom-color: var(--masthead-hairline); }

/* Two-position Reviewer/Developer switch. Reuses the hairline-box vocabulary
   (a bordered group of options) rather than inventing new visual language:
   the active option is filled with the masthead text colour against the dark
   ground (a hard, unambiguous fill, not a subtle colour shift), the inactive
   option is plain text on transparent. See CONSOLE_LANGUAGE.md "Where the
   switch lives, and why". */
.view-switch {
  display: inline-flex;
  border: 1px solid var(--masthead-hairline);
  border-radius: 2px;
  overflow: hidden;
}
.view-switch-option {
  background: transparent;
  border: none;
  color: var(--masthead-text);
  opacity: 0.7;
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.3rem 0.55rem;
  cursor: pointer;
}
.view-switch-option + .view-switch-option { border-left: 1px solid var(--masthead-hairline); }
.view-switch-option:hover { opacity: 0.9; }
.view-switch-option.active {
  background: var(--masthead-text);
  color: var(--masthead-bg);
  opacity: 1;
  cursor: default;
}
.masthead-nav {
  margin-top: 0.6rem;
  display: flex;
  gap: 1.25rem;
}
.masthead-nav a {
  color: var(--masthead-text);
  text-decoration: none;
  font-size: 0.88rem;
  padding-bottom: 0.15rem;
  border-bottom: 2px solid transparent;
}
.masthead-nav a.active { border-bottom-color: var(--periwinkle); }
.masthead-nav a:hover { border-bottom-color: var(--masthead-hairline); }

/* ---------------------------------------------------------------------
   PAGE STRUCTURE
--------------------------------------------------------------------- */
main {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 1.75rem 1.25rem 4rem;
}

h1, h2, h3 { font-weight: 600; margin: 0 0 0.75rem; }
h1 { font-size: 1.15rem; }
h2 { font-size: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--hairline); margin-top: 2rem; }
h3 { font-size: 0.9rem; }
p { margin: 0 0 0.75rem; }

.muted { color: var(--quiet-text); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.hairline-box {
  border: 1px solid var(--hairline-strong);
}

/* ---------------------------------------------------------------------
   STATE TOKENS: shape + colour + text, never colour alone.
   See CONSOLE_PLAN.md "State and outcome, expressed visually".
--------------------------------------------------------------------- */
.state {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font-size: 0.88rem;
}
.state-dot {
  width: 0.6rem;
  height: 0.6rem;
  flex: none;
  display: inline-block;
}
.state-dot.circle { border-radius: 50%; }
.state-dot.circle.hollow { border: 1.5px solid currentColor; background: transparent; }
.state-dot.circle.filled { background: currentColor; }
.state-dot.ring {
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 2.5px var(--paper), 0 0 0 4px currentColor;
}
.state-dot.square { border-radius: 2px; background: currentColor; }
.state-dot.square.hollow { border: 1.5px solid currentColor; background: transparent; }
.state-dot.triangle {
  width: 0; height: 0;
  border-left: 0.4rem solid transparent;
  border-right: 0.4rem solid transparent;
  border-bottom: 0.68rem solid currentColor;
  background: transparent !important;
}
.state-dot.pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

.tone-quiet { color: var(--quiet-text); }
.tone-periwinkle { color: var(--periwinkle); }
.tone-mint { color: var(--mint); }
.tone-peach { color: var(--peach); }
.tone-rose { color: var(--rose); }

/* On the dark masthead, ring outlines must use the masthead background, not paper. */
.masthead .state-dot.ring { box-shadow: 0 0 0 2.5px var(--masthead-bg), 0 0 0 4px currentColor; }

/* --quiet-text is a DARK, desaturated colour, correct for the light reading
   surface and functionally invisible on the dark masthead (dark-on-dark).
   The four saturated hues (periwinkle/mint/peach/rose) hold enough contrast
   against --masthead-bg on their own; only the quiet/neutral tone needs a
   masthead-specific override, to a light neutral instead of a dark one. */
.masthead .tone-quiet { color: rgba(237, 234, 227, 0.65); }

/* ---------------------------------------------------------------------
   RUN LIST
--------------------------------------------------------------------- */
.filter-bar {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}
.filter-bar select, .filter-bar input[type=search] {
  border: 1px solid var(--hairline-strong);
  border-radius: 2px;
  padding: 0.4rem 0.55rem;
  background: var(--paper);
}
.filter-bar input[type=search] { flex: 1; min-width: 10rem; }

.run-list { border-top: 1px solid var(--hairline-strong); }
.run-row {
  display: grid;
  grid-template-columns: 11rem 1fr 6rem 9rem;
  gap: 0.75rem;
  align-items: center;
  padding: 0.65rem 0.25rem;
  border-bottom: 1px solid var(--hairline);
  text-decoration: none;
  color: inherit;
}
.run-row:hover { background: var(--quiet-fill); }
.run-row .rid { font-family: var(--font-mono); font-size: 0.85rem; }
.run-row .task { color: var(--quiet-text); font-size: 0.85rem; }
.run-row .when { color: var(--quiet-text); font-size: 0.85rem; text-align: right; }
/* Human view: the first column carries a friendly title instead of the raw
   run id, so it needs more room than the mono column it replaces. */
.run-row.human { grid-template-columns: 1fr 11rem 6rem 9rem; }
.run-row .title-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-row .title-cell .rid-secondary { display: block; font-size: 0.78rem; margin-top: 0.1rem; }

.empty-state {
  padding: 3rem 1rem;
  text-align: center;
  color: var(--quiet-text);
  border: 1px dashed var(--hairline-strong);
}

/* ---------------------------------------------------------------------
   BUTTONS AND FORMS
--------------------------------------------------------------------- */
.button {
  display: inline-block;
  background: var(--ink);
  color: var(--paper);
  border: 1px solid var(--ink);
  border-radius: 2px;
  padding: 0.5rem 0.9rem;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
}
.button:hover { opacity: 0.85; }
.button:disabled { opacity: 0.4; cursor: not-allowed; }
.button.secondary {
  background: transparent;
  color: var(--ink);
}
.button.danger {
  background: var(--paper);
  color: var(--rose);
  border-color: var(--rose);
}
.button.danger:hover { background: rgba(168, 73, 90, 0.08); }

label { display: block; font-weight: 600; font-size: 0.85rem; margin: 1rem 0 0.3rem; }
label:first-child { margin-top: 0; }
input[type=text], input[type=password], textarea, select.form-control {
  width: 100%;
  border: 1px solid var(--hairline-strong);
  border-radius: 2px;
  padding: 0.5rem 0.6rem;
  background: var(--paper);
  color: var(--ink);
}
input[type=file] { margin-top: 0.2rem; }
.field-hint { font-size: 0.8rem; color: var(--quiet-text); margin-top: 0.25rem; }
.checkbox-row { display: flex; align-items: baseline; gap: 0.5rem; margin: 1rem 0 0; }
.checkbox-row input { margin: 0; }
.checkbox-row label { margin: 0; font-weight: 400; }

.notice {
  border: 1px solid var(--hairline-strong);
  border-left: 3px solid var(--ink);
  padding: 0.65rem 0.85rem;
  margin-top: 1rem;
  font-size: 0.9rem;
}
.notice.error { border-left-color: var(--rose); }
.notice.warn { border-left-color: var(--peach); }
.notice.ok { border-left-color: var(--mint); }

/* ---------------------------------------------------------------------
   RUN DETAIL / WORKING VIEW
--------------------------------------------------------------------- */
.detail-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 0.25rem;
}
.detail-header h1 { margin-bottom: 0.15rem; }
.detail-meta { color: var(--quiet-text); font-size: 0.85rem; }

.status-block {
  border: 1px solid var(--hairline-strong);
  padding: 1rem 1.1rem;
  margin: 1.25rem 0;
}
.status-block .state { font-size: 1rem; margin-bottom: 0.5rem; }
.status-block .next-action { margin-top: 0.6rem; }

.progress-track {
  height: 0.55rem;
  background: var(--quiet-fill);
  border-radius: 1px;
  overflow: hidden;
  margin: 0.75rem 0 0.4rem;
}
.progress-fill { height: 100%; background: var(--periwinkle); }
.progress-caption { font-size: 0.85rem; color: var(--quiet-text); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.25rem 1rem; }

.phase-ladder { list-style: none; margin: 0.5rem 0 0; padding: 0; }
.phase-ladder li {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  padding: 0.3rem 0;
  font-size: 0.88rem;
  color: var(--quiet-text);
}
.phase-ladder li.done { color: var(--ink); }
.phase-ladder li.current { color: var(--ink); font-weight: 600; }
.phase-ladder .mark { width: 1.1rem; flex: none; font-family: var(--font-mono); }

.kv-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.5rem; }
.kv-table td { padding: 0.3rem 0.5rem 0.3rem 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
.kv-table td:first-child { color: var(--quiet-text); width: 11rem; }

.doc-row {
  display: grid;
  grid-template-columns: 1fr 6rem 8rem;
  gap: 0.75rem;
  align-items: center;
  padding: 0.5rem 0.25rem;
  border-bottom: 1px solid var(--hairline);
  font-size: 0.9rem;
}
.doc-row .doc-id { font-family: var(--font-mono); }

/* ---------------------------------------------------------------------
   FINDINGS TABLE
--------------------------------------------------------------------- */
table.findings { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.5rem; }
table.findings th {
  text-align: left;
  font-weight: 600;
  font-size: 0.78rem;
  text-transform: none;
  color: var(--quiet-text);
  border-bottom: 1px solid var(--hairline-strong);
  padding: 0.4rem 0.6rem 0.4rem 0.75rem;
}
table.findings td {
  border-bottom: 1px solid var(--hairline);
  padding: 0.5rem 0.6rem 0.5rem 0.75rem;
  vertical-align: top;
}
table.findings tr.irregular { border-left: 3px solid var(--rose); }
table.findings tr.ok { border-left: 3px solid var(--mint); }
table.findings tr { border-left: 3px solid transparent; }
.fig { font-family: var(--font-mono); white-space: nowrap; }

/* Human view findings: the same left-rule verdict vocabulary as the
   developer table (irregular = rose, ok = mint), reworded as sentences
   instead of table rows. See "Findings, one per relation". */
.findings-human { list-style: none; margin: 0.5rem 0 0; padding: 0; }
.finding-human {
  padding: 0.6rem 0.85rem;
  margin-bottom: 0.5rem;
  border-left: 3px solid transparent;
  background: var(--quiet-fill);
  font-size: 0.92rem;
}
.finding-human.irregular { border-left-color: var(--rose); }
.finding-human.ok { border-left-color: var(--mint); }
.finding-human strong { font-weight: 600; }
.explanation { max-width: 22rem; }
.explanation .truncated {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.expand-toggle { display: inline-block; font-size: 0.78rem; border: none; background: none; color: var(--periwinkle); cursor: pointer; padding: 0; margin-top: 0.3rem; }

/* ---------------------------------------------------------------------
   PAIRING MAP PANEL (collapsed by default)
--------------------------------------------------------------------- */
details.pairs-doc {
  border: 1px solid var(--hairline);
  margin-top: 0.5rem;
}
details.pairs-doc summary {
  cursor: pointer;
  padding: 0.55rem 0.75rem;
  font-size: 0.88rem;
  font-weight: 600;
  list-style: none;
}
details.pairs-doc summary::-webkit-details-marker { display: none; }
details.pairs-doc summary::before { content: "▸ "; color: var(--quiet-text); }
details.pairs-doc[open] summary::before { content: "▾ "; }
.pairs-body { padding: 0 0.75rem 0.75rem; }
.pairs-unit { margin-bottom: 0.75rem; font-size: 0.85rem; }
.pairs-unit .uid { font-family: var(--font-mono); color: var(--quiet-text); }
.rule-chip {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  border: 1px solid var(--hairline-strong);
  border-radius: 2px;
  padding: 0.05rem 0.35rem;
  margin: 0.15rem 0.3rem 0.15rem 0;
}

/* A rule identifier is openable everywhere it appears: a finding's citation,
   the developer table's Rule column, a pairing-map chip (see JS ruleLinkHtml/
   wireRuleLinks). Same underline-on-hover vocabulary as any other link, not
   a new visual language; the panel it opens reuses .notice's hairline-box
   pattern, appended inline rather than a new page. */
a.rule-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 2px;
  cursor: pointer;
}
a.rule-link:hover { text-decoration-style: solid; }
.rule-panel { display: block; }
.rule-panel-body {
  border: 1px solid var(--hairline-strong);
  border-left: 3px solid var(--ink);
  padding: 0.6rem 0.75rem;
  margin: 0.4rem 0 0.6rem;
  font-size: 0.85rem;
  max-width: 34rem;
}
.rule-panel-head { margin-bottom: 0.35rem; display: flex; gap: 0.5rem; align-items: baseline; }
.rule-panel-body p { margin: 0; }

/* A proposed correction, directly under its own finding. Same hairline-box
   vocabulary as .rule-panel-body and .notice, not a new visual language;
   left-rule in --peach (the palette's one deliberately-bold hue, per
   CONSOLE_PLAN.md's boldness section) since a proposed change is exactly
   the kind of thing worth a reader's attention without calling it an error. */
.amendment-block {
  border: 1px solid var(--hairline-strong);
  border-left: 3px solid var(--peach);
  padding: 0.55rem 0.75rem;
  margin: 0.5rem 0 0.25rem;
  font-size: 0.85rem;
}
.amendment-block p { margin: 0.25rem 0; }
.amendment-label { font-weight: 600; margin-bottom: 0.35rem; display: flex; gap: 0.4rem; align-items: baseline; }
.amendment-field-label { color: var(--quiet-text); }
.amendment-repair-note { color: var(--quiet-text); font-size: 0.8rem; font-style: italic; }
.amendment-refusals { border-left: 3px solid var(--peach); padding-left: 0.75rem; margin: 0.5rem 0; }
.amendment-refusals li { margin: 0.35rem 0; }
/* night W8, the Agents page: one section per agent, nine parts each; an
   undecided part keeps the same peach rail the other visible states use. */
.harness-agent { margin: 1.25rem 0 0.5rem; }
.harness-agent h3 { margin: 0 0 0.35rem; }
.harness-open { font-size: 0.85em; font-weight: normal; color: var(--peach); margin-left: 0.5rem; }
.harness-parts { list-style: none; padding-left: 0; margin: 0; }
.harness-part { margin: 0.3rem 0; padding-left: 0.75rem; border-left: 3px solid transparent; }
.harness-part-unresolved { border-left-color: var(--peach); }
.harness-part-missing { border-left-color: var(--peach); font-style: italic; }
.harness-label { font-weight: 600; }

/* ---------------------------------------------------------------------
   LOG VIEWER
--------------------------------------------------------------------- */
.log-box {
  background: var(--masthead-bg);
  color: var(--masthead-text);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  padding: 0.85rem;
  max-height: 22rem;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ---------------------------------------------------------------------
   PENDING APPROVAL BLOCK
--------------------------------------------------------------------- */
.approval-message { font-size: 0.95rem; margin: 0.5rem 0 0.75rem; }
.approval-actions { display: flex; gap: 0.6rem; margin-top: 0.75rem; flex-wrap: wrap; align-items: center; }
.approval-actions textarea { width: 100%; min-height: 3.5rem; margin: 0.5rem 0 0.75rem; }

/* ---------------------------------------------------------------------
   RESPONSIVE
--------------------------------------------------------------------- */
@media (max-width: 640px) {
  .masthead-row { flex-direction: column; align-items: stretch; gap: 0.5rem; }
  .masthead-right { justify-content: space-between; }
  .run-row, .run-row.human { grid-template-columns: 1fr; gap: 0.2rem; }
  .run-row .when { text-align: left; }
  .doc-row { grid-template-columns: 1fr; }
  table.findings { display: block; overflow-x: auto; }
}

[hidden] { display: none !important; }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-row">
      <p class="masthead-name">SHIMMER: Review desk</p>
      <div class="masthead-right">
        <div id="masthead-state" class="masthead-state" hidden></div>
        <div id="view-switch" class="view-switch" role="group" aria-label="Language">
          <button type="button" id="view-switch-human" class="view-switch-option">Reviewer</button>
          <button type="button" id="view-switch-developer" class="view-switch-option">Developer</button>
        </div>
        <a href="#" id="token-link" class="tone-quiet masthead-token-link"></a>
      </div>
    </div>
    <nav class="masthead-nav">
      <a href="#/runs" id="nav-runs">Runs</a>
      <a href="#/submit" id="nav-submit">Submit</a>
      <a href="#/agents" id="nav-agents">Agents</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<script>
(function () {
"use strict";

/* =======================================================================
   TOKEN: sessionStorage, never localStorage, never a URL.
   Survives a same-tab reload (so a reviewer mid-run does not retype it);
   cleared when the tab closes. See CONSOLE_PLAN.md "The waiting page's
   persistence requirement."
======================================================================= */
var TOKEN_KEY = "shimmer_console_token";

function getToken() {
  try { return sessionStorage.getItem(TOKEN_KEY) || ""; }
  catch (e) { return ""; }
}
function setToken(t) {
  try { sessionStorage.setItem(TOKEN_KEY, t); } catch (e) { /* private-window etc: token just won't survive reload */ }
}
function clearToken() {
  try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
}

/* api/CONSOLE_LANGUAGE.md "What I decided about the token control, and why":
   the masthead keeps a single quiet link, "Not signed in" / "Signed in",
   instead of a permanent input+button+status row. Clicking it opens the
   existing no-token entry screen (renderNeedsToken) on demand, in either
   language view, rather than only automatically when a protected route
   401s or no token is set yet. */
var tokenLink = document.getElementById("token-link");
var forceTokenScreen = false;

function refreshTokenUi() {
  var t = getToken();
  tokenLink.textContent = t ? "Signed in" : "Not signed in";
}
tokenLink.addEventListener("click", function (e) {
  e.preventDefault();
  forceTokenScreen = true;
  render();
});
refreshTokenUi();

/* =======================================================================
   VIEW MODE: "human" (default, every first load, per CONSOLE_LANGUAGE.md's
   "Where the switch lives, and why") or "developer". Stored in sessionStorage
   under its OWN key, separate from the token, so clearing one never clears
   the other. Once a choice is made in this tab, it is remembered for the
   rest of the session; a fresh tab always starts on the human view.
======================================================================= */
var VIEW_KEY = "shimmer_console_view";

function getView() {
  try {
    var v = sessionStorage.getItem(VIEW_KEY);
    return (v === "human" || v === "developer") ? v : "human";
  } catch (e) { return "human"; }
}
function setView(v) {
  try { sessionStorage.setItem(VIEW_KEY, v); } catch (e) { /* private-window etc: choice just won't survive reload */ }
}
function isHumanView() { return getView() === "human"; }

var viewSwitchHuman = document.getElementById("view-switch-human");
var viewSwitchDeveloper = document.getElementById("view-switch-developer");

function refreshViewSwitchUi() {
  var v = getView();
  viewSwitchHuman.classList.toggle("active", v === "human");
  viewSwitchDeveloper.classList.toggle("active", v === "developer");
  viewSwitchHuman.setAttribute("aria-pressed", v === "human" ? "true" : "false");
  viewSwitchDeveloper.setAttribute("aria-pressed", v === "developer" ? "true" : "false");
}
viewSwitchHuman.addEventListener("click", function () { setView("human"); refreshViewSwitchUi(); render(); });
viewSwitchDeveloper.addEventListener("click", function () { setView("developer"); refreshViewSwitchUi(); render(); });
refreshViewSwitchUi();

/* =======================================================================
   FETCH WRAPPER
======================================================================= */
function api(path, opts) {
  opts = opts || {};
  var headers = opts.headers || {};
  var t = getToken();
  if (t) headers["Authorization"] = "Bearer " + t;
  return fetch(path, Object.assign({}, opts, { headers: headers }))
    .then(function (r) {
      if (r.status === 401) {
        clearToken();
        refreshTokenUi();
      }
      return r;
    });
}

function apiJson(path, opts) {
  return api(path, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (body) {
      return { ok: r.ok, status: r.status, body: body, headers: r.headers };
    });
  });
}

/* Server `detail` is sometimes a plain string, sometimes {error, report}
   (POST /submit's contract-validation failure): read either honestly,
   never invent a friendlier message than the server actually gave. */
function detailText(body) {
  var d = body && body.detail;
  if (typeof d === "string") return d;
  if (d && typeof d === "object") {
    if (d.error && d.report) return d.error + ": " + d.report;
    if (d.error) return d.error;
    try { return JSON.stringify(d); } catch (e) { return String(d); }
  }
  return "The server did not explain why.";
}

/* =======================================================================
   STATE / OUTCOME → visual token
   See CONSOLE_PLAN.md "State and outcome, expressed visually".
======================================================================= */
function stateToken(state, outcome) {
  if (state === "queued") return { dot: "circle hollow", tone: "quiet", label: "Queued" };
  if (state === "running") return { dot: "circle filled pulse", tone: "periwinkle", label: "Running" };
  if (state === "awaiting_approval") return { dot: "ring", tone: "periwinkle", label: "Awaiting your decision" };
  if (state === "cancelled") return { dot: "square hollow", tone: "quiet", label: "Cancelled" };
  if (state === "stopped") {
    if (outcome === "succeeded") return { dot: "circle filled", tone: "mint", label: "Completed" };
    if (outcome === "governance_stop") return { dot: "square", tone: "peach", label: "Stopped by a rule" };
    if (outcome === "crashed") return { dot: "triangle", tone: "rose", label: "Crashed" };
    if (outcome === "timed_out") return { dot: "triangle", tone: "rose", label: "Timed out" };
  }
  return { dot: "circle hollow", tone: "quiet", label: state || "Unknown" };
}

function stateDotHtml(tok, opts) {
  opts = opts || {};
  var shapeClasses = tok.dot.split(" ").map(function (c) {
    return c === "circle" || c === "square" || c === "hollow" || c === "filled" || c === "pulse" || c === "ring" || c === "triangle" ? c : "";
  }).join(" ");
  return '<span class="state-dot ' + shapeClasses + '"></span>';
}

function stateHtml(state, outcome) {
  var tok = stateToken(state, outcome);
  return '<span class="state tone-' + tok.tone + '">' + stateDotHtml(tok) + '<span>' + escapeHtml(tok.label) + '</span></span>';
}

/* =======================================================================
   GOVERNANCE / CRASH DETAIL COPY
   See CONSOLE_PLAN.md's copy section: a governance stop names the rule and
   what happens next; a crash shows a truncated detail with a log link,
   never dumps the raw (up to 2000-char) tail inline.
======================================================================= */
var GOVERNANCE_SENTENCES = {
  stopped_model_approval: "A deprecated model assignment needed operator approval and the run's wait window closed before one was recorded.",
  stopped_redaction_gate: "The redaction gate stopped the run before completion.",
  blocked: "The pipeline blocked itself: a redaction block at run-end, or (in draft mode) a memo-generation failure the run could not recover from. Check the log for which.",
  refused_sensitivity_layer_inactive: "This run was declared sensitive, but the privacy masking layer is not active on this server, so the run refused to start rather than risk an unprotected sensitive submission.",
  cancelled: "Cancelled by request."
};

/* HUMAN VIEW: one plain-language sentence per governance code, paired with
   GOVERNANCE_SENTENCES above rather than reusing one fixed sentence for all
   four codes. A single hardcoded sentence here was a real bug: it happened
   to describe stopped_model_approval correctly and would have been wrong
   for the other three (a real run stopping for stopped_redaction_gate,
   blocked, or refused_sensitivity_layer_inactive is not "waiting on an
   operator decision" at all), silently filtering the human view down to
   one code's meaning. See docs/api/CONSOLE_LANGUAGE.md's approved sentence
   for stopped_model_approval; the other three follow the same register. */
var GOVERNANCE_SENTENCES_HUMAN = {
  stopped_model_approval: "The system refused to keep going without a decision from the operator running it, and none came in time.",
  stopped_redaction_gate: "The system's privacy check stopped the review before it finished.",
  blocked: "The system blocked itself: either a privacy check at the very end, or (for a generated memo) a drafting step that could not recover. The full log says which.",
  refused_sensitivity_layer_inactive: "This review was marked as sensitive, but the server's privacy protection was not switched on, so it refused to start rather than risk exposing something it should not have."
};

function nextActionSentence(run) {
  var state = run.state, outcome = run.outcome;
  if (state === "queued") return "Waiting for the run ahead of it to finish. Nothing to do: this page updates on its own.";
  if (state === "running") return "Nothing to do yet. This page updates on its own; you can leave and come back.";
  if (state === "awaiting_approval") return "This run is waiting on you: decide below, or come back to it later. The run will not continue until you do.";
  if (state === "cancelled") {
    var cdetail = (run.stop_reason && run.stop_reason.detail) || "cancelled by request";
    return "Cancelled: " + cdetail + ".";
  }
  if (state === "stopped") {
    if (outcome === "succeeded") {
      /* documents is always an array on a run record (_run_record ->
         _documents_for_run, server.py), populated only once phase 5.5 has
         paired at least one unit; empty here means genuinely nothing was
         produced (most often: no conventions were loaded for this run,
         pipeline.py's own "phase_skipped phase=5.5 reason=no_conventions"),
         not that findings/an archive exist but failed to load. A run this
         empty must not say "start with the findings below" or "download
         the archive": both would point at something that is not there
         (the archive route itself 404s: server.py's own deliverables
         route requires at least one file under deliverables/). The cause
         is not asserted here, only that the log explains it, since this
         function cannot rule out a cause other than missing conventions. */
      if (!run.documents || run.documents.length === 0) {
        return "Finished, but no document reached the point of being checked against a rule. Nothing to read below, nothing to download. See the log for why.";
      }
      return "Finished. Start with the findings below, or download the full archive.";
    }
    if (outcome === "governance_stop") {
      var code = run.stop_reason && run.stop_reason.code;
      var sentence = GOVERNANCE_SENTENCES[code] || "The pipeline stopped itself on purpose, under a governance rule.";
      return "Stopped by a rule. This was not an error: the pipeline refused on purpose. " + sentence;
    }
    if (outcome === "crashed" || outcome === "timed_out") {
      return "The run did not finish. See the detail below, or the full log. You can submit it again.";
    }
  }
  return "";
}

/* =======================================================================
   HUMAN VIEW: run state / outcome, all seven combinations plus the two
   cancelled sub-cases. See docs/api/CONSOLE_LANGUAGE.md "Run state and
   outcome, all seven combinations". A rewording, never a filtering: every
   fact nextActionSentence()/GOVERNANCE_SENTENCES carries is carried here
   too, just in the reader-facing sentence rather than the developer one.
======================================================================= */
function mutedParen(text) {
  return '<span class="muted mono" style="font-size:0.8rem">(' + escapeHtml(text) + ')</span>';
}

/* mutedParen's own wrapper, for callers that already have escaped/built
   HTML inside (a clickable rule-id span), never escaping twice. */
function mutedParenHtml(html) {
  return '<span class="muted mono" style="font-size:0.8rem">(' + html + ')</span>';
}

function nextActionSentenceHuman(run) {
  var state = run.state, outcome = run.outcome;
  if (state === "queued") {
    return '<strong>Waiting to start.</strong> Another review is running first; this one will begin as soon as it finishes. Nothing to do. ' + mutedParen("state: queued");
  }
  if (state === "running") {
    var prog = parseProgress(run.progress);
    var idx = phaseIndex(prog.phase);
    var pname = phaseHumanName(prog.phase, run.task);
    var stepText = (idx >= 0) ? (", phase " + (idx + 1) + " of " + PHASES.length + ', "' + escapeHtml(pname || currentPhaseName(prog.phase) || "") + '"') : "";
    return '<strong>In progress' + (pname ? ": " + escapeHtml(pname).toLowerCase() : "") + '.</strong> This page updates on its own; it is fine to leave and come back. ' +
      mutedParen("state: running" + stepText);
  }
  if (state === "awaiting_approval") {
    /* Short, generic, status-box-only: the full detail (the folded message,
       figures, any extra payload facts, and the rule/unit parenthetical)
       lives exclusively in renderApprovalBlock()/approvalDetailHtml() below,
       the same split the developer view already uses (nextActionSentence's
       own awaiting_approval line is generic too; pa.message appears only
       once, in the approval block). Showing the same paragraph twice was a
       real bug, not a design choice: fixed here by never building the full
       sentence in this function at all. */
    return '<strong>Paused: needs your decision.</strong> Decide below, or come back to it later. ' +
      'The review will not continue until you answer. ' + mutedParen("state: awaiting_approval");
  }
  if (state === "cancelled") {
    var cdetail = (run.stop_reason && run.stop_reason.detail) || "";
    var sub = cdetail.indexOf("before it started") !== -1
      ? "It had not started yet."
      : "It had already begun; whatever finished before the cancellation is still available below.";
    return '<strong>Cancelled, at your request.</strong> ' + sub + " " + mutedParen("state: cancelled");
  }
  if (state === "stopped") {
    if (outcome === "succeeded") {
      /* Same structural check as nextActionSentence()'s succeeded branch,
         same reason: an empty documents array means nothing was actually
         produced, most often because no rules were loaded for this run,
         though this function has no way to rule out another cause, so
         none is named here, only that the log carries it. A rewording,
         not a filtering, in the other direction too: this empty case must
         be as visible here as it now is in the developer view, not
         smoothed over by the reviewer view's plainer language. */
      if (!run.documents || run.documents.length === 0) {
        return '<strong>Finished, but nothing was checked.</strong> No document reached the point of being compared against a rule. There is nothing to read below and nothing to download. The log explains why. ' + mutedParen("state: completed, no documents");
      }
      return '<strong>Finished. No problems stopped the review.</strong> Start with the findings below, or download the full archive. ' + mutedParen("state: completed");
    }
    if (outcome === "governance_stop") {
      var code = run.stop_reason && run.stop_reason.code;
      var sentenceHuman = GOVERNANCE_SENTENCES_HUMAN[code] || "A rule this system enforces stopped the review before it could finish.";
      return '<strong>Stopped on purpose, before finishing. This is not an error.</strong> ' + sentenceHuman + ' ' +
        'Nothing you submitted was lost; if you resubmit, the review restarts from the beginning. ' + mutedParen("governance code: " + (code || ""));
    }
    if (outcome === "crashed") {
      return '<strong>The review stopped before it finished, because of a fault in the system, not in your document.</strong> Nothing you submitted was lost. ' +
        "You can submit it again; if it fails the same way twice, that is worth reporting. " + mutedParen("technical detail in the developer view and the full log");
    }
    if (outcome === "timed_out") {
      return '<strong>The review did not finish in time and was stopped.</strong> This is a failure, not a refusal: nothing about your document caused it to be turned away, ' +
        "it simply ran longer than the system allows and had to be cut off. Nothing you submitted was lost. You can submit it again. " + mutedParen("run timeout, not a governance rule");
    }
  }
  return "";
}

/* HUMAN VIEW: the full detail of a pending approval (the payload's message,
   figures, any other fact the payload carries, and the rule/unit
   parenthetical), folded into one coherent statement. Used ONLY by
   renderApprovalBlock(), in the section with the Approve/Deny buttons: the
   status box above shows nextActionSentenceHuman()'s short, generic line
   instead. Showing this full paragraph in BOTH places was a real, reported
   bug (the same sentence appeared twice, word for word); the fix is
   structural, not cosmetic: this text now exists in exactly one place. */
function approvalDetailHuman(run) {
  var pa = run.pending_approval || {};
  var msg = pa.message || pa.topic || "";
  var payload = pa.payload || {};
  var figureSentence = "";
  if (payload.value_a !== undefined || payload.value_b !== undefined) {
    figureSentence = " The figure in question is " + escapeHtml(String(payload.value_a)) + " against " + escapeHtml(String(payload.value_b)) +
      (payload.unit_id ? (" for unit " + escapeHtml(String(payload.unit_id))) : "") + ".";
  }
  var ruleUnitParen = [];
  if (payload.rule_id) ruleUnitParen.push("rule " + payload.rule_id);
  if (payload.unit_id) ruleUnitParen.push("unit " + payload.unit_id);
  /* Every OTHER payload key (beyond value_a/value_b/unit_id/rule_id/message,
     already folded into the sentence above) still needs to surface here:
     the human view is a rewording, never a filtering, so a topic this
     console has no dedicated sentence for still shows its remaining facts,
     just as "key: value" clauses rather than a table. */
  var handled = { value_a: 1, value_b: 1, unit_id: 1, rule_id: 1, message: 1 };
  var extra = Object.keys(payload).filter(function (k) { return !handled[k]; });
  var extraSentence = extra.length
    ? (" Also: " + extra.map(function (k) { return k + " " + payload[k]; }).join(", ") + ".")
    : "";
  return escapeHtml(msg) + figureSentence + escapeHtml(extraSentence) +
    (ruleUnitParen.length ? (" " + mutedParen(ruleUnitParen.join(", "))) : "");
}

/* =======================================================================
   PHASE LADDER: the real, non-contiguous sequence. TOTAL_PHASES=9 in
   pipeline.py, but only these numbers are ever emitted (2/4/8 do not
   exist as their own phases); 5.5 is conditional on conventions existing.
   See CONSOLE_PLAN.md "Where the progress proportion comes from".
======================================================================= */
/* Phase 3's human label is task-aware, the one phase where review and draft
   genuinely differ (docs/api/CONSOLE_LAYOUT_PLAN.md "Item 2"): traced
   PRODUCTION_AGENTS_PER_DOC/CORPUS_LEVEL against their contracts in
   config/agent_contracts.json. For review, PROCESSOR's own contract
   (item_kind: "extraction", draft_text, extraction_method,
   claims_referenced) breaks the document into sections and claims, it does
   not draft; LEGAL_ANALYST checks each claim is grounded and flags a
   mechanism common across the corpus but absent from this document. For
   draft, genesis.md's own Phase 4 description applies literally ("PROCESSOR
   drafts with all gathered context"), since a draft run's phase 0 memo
   generation is exactly that. Every other phase's human label already
   applies equally to both tasks and keeps one shared string. */
var PHASES = [
  { n: "1", name: "Situation assessment", human: "Reading the document and understanding what it covers" },
  { n: "3", name: "Content production",
    humanReview: "Breaking the document into its parts and checking that its claims are grounded",
    humanDraft: "Drafting the memo from the question and the material gathered so far" },
  { n: "5", name: "Verification & fact-check", human: "Checking facts and figures for internal consistency" },
  { n: "5.5", name: "Convention review", human: "Checking the document against the rules" },
  { n: "6", name: "Synthesis", human: "Putting the findings together" },
  { n: "6.5", name: "Editorial review", human: "A second pass over the findings for quality" },
  { n: "7", name: "Audit synthesis", human: "Preparing the final summary and record" },
  { n: "9", name: "Redaction screening", human: "Checking for anything that should stay private" }
];

function phaseIndex(currentPhase) {
  var idx = -1;
  PHASES.forEach(function (p, i) { if (p.n === currentPhase) idx = i; });
  return idx;
}

/* task: "review" or "draft" (run.task); only phase 3 branches on it, every
   other phase's `human` string is shared and task is ignored for them. */
function phaseHumanLabel(p, task) {
  if (p.humanReview || p.humanDraft) {
    return task === "draft" ? p.humanDraft : p.humanReview;
  }
  return p.human;
}

function phaseHumanName(currentPhase, task) {
  var found = PHASES.filter(function (p) { return p.n === currentPhase; })[0];
  return found ? phaseHumanLabel(found, task) : null;
}

/* Parse the raw "[progress]" body server.py already strips the prefix
   from: "phase=5.5/9 doc=1/1 agent=PRACTICE_AUDITOR status=running". */
function parseProgress(raw) {
  var out = {};
  if (!raw) return out;
  raw.split(/\s+/).forEach(function (tok) {
    var i = tok.indexOf("=");
    if (i > 0) out[tok.slice(0, i)] = tok.slice(i + 1);
  });
  if (out.phase) out.phase = out.phase.split("/")[0];
  return out;
}

function phaseLadderHtml(currentPhase) {
  var idx = -1;
  PHASES.forEach(function (p, i) { if (p.n === currentPhase) idx = i; });
  var items = PHASES.map(function (p, i) {
    var cls = "", mark = "·";
    if (idx >= 0 && i < idx) { cls = "done"; mark = "✓"; }
    else if (i === idx) { cls = "current"; mark = "▶"; }
    return '<li class="' + cls + '"><span class="mark">' + mark + '</span><span>' + p.n + '&nbsp;&nbsp;' + escapeHtml(p.name) + '</span></li>';
  }).join("");
  return '<ul class="phase-ladder">' + items + '</ul>';
}

/* Human-view phase ladder: the human phase name plus "step N of 8", instead
   of the raw phase number and its developer label. See
   docs/api/CONSOLE_LANGUAGE.md "A phase label". */
function phaseLadderHumanHtml(currentPhase, task) {
  var idx = phaseIndex(currentPhase);
  var items = PHASES.map(function (p, i) {
    var cls = "", mark = "·";
    if (idx >= 0 && i < idx) { cls = "done"; mark = "✓"; }
    else if (i === idx) { cls = "current"; mark = "▶"; }
    return '<li class="' + cls + '"><span class="mark">' + mark + '</span><span>' +
      'step ' + (i + 1) + ' of ' + PHASES.length + '&nbsp;&nbsp;' + escapeHtml(phaseHumanLabel(p, task)) + '</span></li>';
  }).join("");
  return '<ul class="phase-ladder">' + items + '</ul>';
}

function currentPhaseName(currentPhase) {
  var found = PHASES.filter(function (p) { return p.n === currentPhase; })[0];
  return found ? found.name : null;
}

/* =======================================================================
   PAIR-SETTLEMENT BAR: only drawn when it can be honest.
   pairs_arithmetic_only is a real LOWER BOUND (settled with no model
   call); it is not the live edge of progress, and the copy says so.
   Never drawn before pairs_planned > 0, never in wide mode (the field
   is null there: server.py's own comment explains why the subtraction
   is not meaningful in wide mode).
======================================================================= */
function pairBarHtml(run) {
  var planned = run.pairs_planned, settled = run.pairs_arithmetic_only, calls = run.model_calls;
  if (!planned || settled === null || settled === undefined) return "";
  var pct = Math.max(0, Math.min(100, Math.round((settled / planned) * 100)));
  return (
    '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="progress-caption">' +
      '<span>at least ' + settled + ' of ' + planned + ' pairs settled</span>' +
      '<span>' + (calls || 0) + ' model call' + ((calls === 1) ? "" : "s") + ' so far</span>' +
    '</div>' +
    '<p class="muted" style="font-size:0.8rem;margin-top:0.35rem">' +
      settled + ' pairs closed by arithmetic alone, with no model call. This is a floor, not a live counter: ' +
      'pairs a model is actively judging are not separately counted.' +
    '</p>'
  );
}

/* =======================================================================
   TIME ESTIMATE: only from real history (GET /runs), only when there is
   a real comparable sample, always labelled by its own sample size.
   See CONSOLE_PLAN.md's exact derivation and honesty rules.
======================================================================= */
function estimateRemaining(run, allRuns) {
  if (!run.started_at) return null;
  var comparable = (allRuns || []).filter(function (r) {
    return r.run_id !== run.run_id &&
      r.task === run.task && r.review_mode === run.review_mode &&
      r.state === "stopped" && r.outcome === "succeeded" &&
      r.started_at && r.completed_at;
  });
  if (comparable.length === 0) return null;
  var durations = comparable.map(function (r) {
    return (new Date(r.completed_at).getTime() - new Date(r.started_at).getTime()) / 60000;
  }).filter(function (m) { return m > 0; }).sort(function (a, b) { return a - b; });
  if (durations.length === 0) return null;
  var median = durations[Math.floor(durations.length / 2)];
  var elapsed = (Date.now() - new Date(run.started_at).getTime()) / 60000;
  var n = durations.length;
  var qualifier = n < 3 ? " (based on " + n + " earlier run" + (n === 1 ? "" : "s") + ", treat this loosely)" : " (rough, from " + n + " earlier runs)";
  /* Honesty, not false precision: once elapsed time has already reached or
     passed the historical median, "~0 min remaining" reads as a broken
     countdown, not as the true statement it actually is (this run is
     already at or past what a comparable run usually takes). Say that
     plainly instead of printing a number that looks like a promise. */
  if (elapsed >= median) {
    return "already past the typical duration for a comparable run" + qualifier;
  }
  var remaining = Math.round(median - elapsed);
  if (remaining < 1) return "under a minute, typically" + qualifier;
  return "~" + remaining + " min" + qualifier;
}

/* =======================================================================
   ROUTER: hash-based, so a run's URL (#/runs/{run_id}) survives a
   reload and can be handed to another device. See CONSOLE_PLAN.md.
======================================================================= */
var app = document.getElementById("app");
var mastheadState = document.getElementById("masthead-state");
var pollTimer = null;

function clearPoll() { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }

function currentRoute() {
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean);
  if (parts[0] === "runs" && parts[1]) return { view: "detail", runId: decodeURIComponent(parts[1]) };
  if (parts[0] === "submit") return { view: "submit" };
  if (parts[0] === "agents") return { view: "agents" };
  return { view: "list" };
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function setNavActive(view) {
  document.getElementById("nav-runs").classList.toggle("active", view === "list" || view === "detail");
  document.getElementById("nav-submit").classList.toggle("active", view === "submit");
  document.getElementById("nav-agents").classList.toggle("active", view === "agents");
}

function render() {
  clearPoll();
  mastheadState.hidden = true;
  refreshViewSwitchUi();
  refreshTokenUi();
  var route = currentRoute();
  setNavActive(route.view);
  if (forceTokenScreen || !getToken()) { renderNeedsToken(); return; }
  if (route.view === "submit") { renderSubmit(); return; }
  if (route.view === "detail") { renderDetail(route.runId); return; }
  if (route.view === "agents") { renderAgents(); return; }
  renderList();
}

/* =======================================================================
   AGENTS (night chain W8): the nine-part harness from W4, one entry per
   agent, exactly as GET /harness serves config/agent_harness.json. An
   undecided part is shown AS undecided, with the reason the file records,
   never omitted: the harness's own rule (gate check 195) is that an omitted
   part is indistinguishable from one nobody thought of. Two views, same
   data: the reviewer view names each part in plain words, the developer
   view uses the file's own part keys and field names. Nothing is hidden
   because it is awkward.
======================================================================= */
var HARNESS_PART_LABELS_HUMAN = {
  agent_itself: "What it does",
  constitution_by_default: "The rules it always carries",
  rule_cluster: "The subjects it handles",
  testing_against_cluster: "How that is tested",
  ontology: "What it draws from the shared knowledge store",
  receive_format: "What it receives",
  hand_format: "What it hands back",
  fires_at_all: "When it runs",
  refire_condition_and_limit: "Whether it runs again"
};

function harnessPartSummary(part, shared) {
  /* One line for a decided part: resolve a shared-parts indirection first,
     then take the first prose-bearing field the file carries. Never
     invents text: a part with none of these fields reads as "decided". */
  if (!part || typeof part !== "object") return "";
  if (part.see && typeof part.see === "string" && part.see.indexOf("shared_parts.") === 0) {
    var key = part.see.slice("shared_parts.".length);
    part = (shared || {})[key] || part;
  }
  if (Array.isArray(part.does) && part.does.length) return part.does.join("; ");
  var fields = ["condition", "how", "where", "summary", "text", "note", "reason", "limit"];
  for (var i = 0; i < fields.length; i++) {
    if (typeof part[fields[i]] === "string" && part[fields[i]]) return part[fields[i]];
  }
  if (Array.isArray(part.declared_subjects)) {
    if (part.declared_subjects.length) return "declares: " + part.declared_subjects.join(", ");
    return "declares no subject, by decision" + (part.subjects_note ? ": " + part.subjects_note : "");
  }
  return "decided";
}

function harnessHtml(body, human) {
  var agents = body.agents || {};
  var names = Object.keys(agents).sort();
  var partNames = body.part_names || [];
  var shared = body.shared_parts || {};
  var unresolved = body.unresolved || {};
  var unresolvedCount = body.unresolved_part_count || 0;
  var heading = human
    ? "Agents (" + names.length + ")"
    : "agent_harness (" + names.length + " agents)";
  var note = human
    ? "Every agent, described in nine parts. A part still undecided is shown as undecided with the reason, not left out." +
      (unresolvedCount ? " Undecided parts: " + unresolvedCount + "." : " Every part is decided.")
    : "config/agent_harness.json as served by GET /harness; nine parts per agent (night W4). unresolved_part_count=" + unresolvedCount + ".";
  var html = '<h2>' + escapeHtml(heading) + '</h2><p class="muted">' + escapeHtml(note) + '</p>';
  names.forEach(function (name) {
    var entry = agents[name] || {};
    var open = (unresolved[name] || []).length;
    html += '<section class="harness-agent"><h3>' + escapeHtml(name) +
      (open ? ' <span class="harness-open">' + escapeHtml(human ? (open + " undecided") : ("unresolved=" + open)) + '</span>' : '') + '</h3>';
    html += '<ul class="harness-parts">';
    partNames.forEach(function (p) {
      var part = entry[p];
      var label = human ? (HARNESS_PART_LABELS_HUMAN[p] || p) : p;
      if (!part || typeof part !== "object") {
        html += '<li class="harness-part harness-part-missing"><span class="harness-label">' + escapeHtml(label) + '</span>: ' +
          escapeHtml(human ? "not recorded in the harness file" : "missing from agent_harness.json") + '</li>';
        return;
      }
      if (part.decided === false) {
        html += '<li class="harness-part harness-part-unresolved"><span class="harness-label">' + escapeHtml(label) + '</span>: ' +
          '<strong>' + escapeHtml(human ? "undecided" : "decided: false") + '</strong> ' +
          escapeHtml(part.unresolved_because || (human ? "(no reason recorded)" : "(no unresolved_because)")) + '</li>';
        return;
      }
      html += '<li class="harness-part"><span class="harness-label">' + escapeHtml(label) + '</span>: ' +
        (human ? escapeHtml(harnessPartSummary(part, shared)) : '<span class="mono">' + escapeHtml(harnessPartSummary(part, shared)) + '</span>') + '</li>';
    });
    html += '</ul></section>';
  });
  return html;
}

function ontologyStoreHtml(body, human) {
  /* ontology chain job 1: the store's first reader on this surface.

     The store under ontology/stores/ has been written at the end of every
     run since build B1 and shown to nobody. This section shows what it
     holds: which agent produced which provision under which rule, in which
     run. Same discipline as every other section here, it disappears when it
     has nothing true to say, and an EMPTY store is exactly that case, which
     is the state of every store today (the only writer is run-end capture).

     Deliberately modest wording: this is provenance of decisions already
     made, not a cross-run signal the review draws on. Nothing here claims
     the store helps a review in progress. */
  if (!body || !body.provision_count) return "";
  var agents = (body.agents || []).map(function (a) {
    return '<li class="mono">' + escapeHtml(a.agent) + ': ' + a.provisions + '</li>';
  }).join("");
  var rules = (body.rules || []).map(function (r) {
    return '<li class="mono">' + escapeHtml(r.convention_ref) + ': ' + r.provisions + '</li>';
  }).join("");
  var heading = human
    ? "What the ontology store holds (" + body.provision_count + ")"
    : "ontology.provisions (" + body.provision_count + ", scope " + escapeHtml(body.scope || "") + ")";
  var note = human
    ? "Provisions captured at the end of past runs, each with the agent whose finding it rests on and the rule that governed it. A record of what was decided before, for looking up afterwards; a review in progress does not read it."
    : "GET /ontology: provenance only, no provision text. stubs=" + (body.stub_count || 0) +
      ", superseded_in_live=" + (body.superseded_in_live || 0) +
      ", log_events=" + (body.log_events || 0) +
      ", without_provenance=" + (body.without_provenance || 0) + ".";
  var out = '<h2>' + heading + '</h2><p class="muted">' + escapeHtml(note) + '</p>';
  if (agents) {
    out += '<h3>' + (human ? "By agent" : "by_agent") + '</h3><ul class="amendment-refusals">' + agents + '</ul>';
  }
  if (rules) {
    out += '<h3>' + (human ? "By rule" : "by_convention_ref") + '</h3><ul class="amendment-refusals">' + rules + '</ul>';
  }
  return out;
}

function renderAgents() {
  app.innerHTML = '<p class="muted">Loading…</p>';
  apiJson("/harness").then(function (res) {
    if (currentRoute().view !== "agents") return;
    if (!res.ok) {

        escapeHtml(detailText(res.body)) + '</div>';
      return;
    }
    app.innerHTML = harnessHtml(res.body, isHumanView());
    /* The ontology store is cross-run, like the harness itself, so it belongs
       on this page rather than on any one run's page. Fetched separately so a

    var ontologyHolder = document.createElement("div");
    ontologyHolder.id = "ontology-store-holder";
    app.appendChild(ontologyHolder);
    apiJson("/ontology").then(function (ontRes) {

    });
  }).catch(function () {

}

/* The token entry screen. Reachable two ways: automatically, whenever no
   token is set yet or a protected route 401s (clearToken + render()); or on
   demand, via the masthead's "Not signed in" / "Signed in" link, which sets
   forceTokenScreen so this screen shows even though a token is already
   saved (the console "has no login flow to redirect to, so there must
   always be a way back to the entry screen", CONSOLE_LANGUAGE.md). Works
   identically in both language views: this screen is not part of the
   developer/reviewer wording split. */
function renderNeedsToken() {
  var already = getToken();
  app.innerHTML =
    '<div class="empty-state" style="text-align:left">' +
      (already
        ? '<p>Replace the saved access token, or continue with the one already set.</p>'
        : '<p>Enter the access token to continue.</p>') +
      '<p class="muted" style="font-size:0.85rem">The token is kept only for this browser tab, for this session. It is never stored beyond that, and never appears in a URL.</p>' +
      '<label for="needs-token-input">Access token</label>' +
      '<input type="password" id="needs-token-input" placeholder="access token" autocomplete="off" style="max-width:20rem">' +
      '<div style="margin-top:0.75rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">' +
        '<button type="button" class="button" id="needs-token-save">Use this token</button>' +
        (already ? '<button type="button" class="button secondary" id="needs-token-continue">Continue without changing it</button>' : '') +
      '</div>' +
    '</div>';
  var input = document.getElementById("needs-token-input");
  var save = document.getElementById("needs-token-save");
  save.addEventListener("click", function () {
    var v = input.value.trim();
    if (!v) return;
    setToken(v);
    forceTokenScreen = false;
    refreshTokenUi();
    render();
  });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") save.click(); });
  var cont = document.getElementById("needs-token-continue");
  if (cont) cont.addEventListener("click", function () { forceTokenScreen = false; render(); });
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* "N min ago" alone cannot tell two runs of the SAME document apart: a
   reviewer who submits the same file twice, even minutes apart, sees both
   rows carry the identical friendly name (runFriendlyTitle below) and two
   coarse relative times close enough to require doing subtraction to tell
   which is which. Past the first minute, this always carries a real clock
   time, so the time column itself does the separating work rather than
   leaning on the run identifier alone: "just now" for the current action,
   a bare clock time for the rest of today, "yesterday, HH:MM" and
   "N days ago, HH:MM" for older runs on the same reasoning, since two
   same-named runs from the same earlier day are exactly as ambiguous under
   a bare day count as two from today are under a bare minute count. */
function relativeWhen(iso) {
  if (!iso) return "";
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  var diffMs = Date.now() - d.getTime();
  var mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  var hh = d.getHours(), mm = d.getMinutes();
  var clock = (hh < 10 ? "0" + hh : hh) + ":" + (mm < 10 ? "0" + mm : mm);
  var hrs = Math.floor(mins / 60);
  if (hrs < 24 && d.toDateString() === new Date().toDateString()) return clock;
  var days = Math.floor(hrs / 24);
  if (days === 1) return "yesterday, " + clock;
  if (days < 7) return days + " days ago, " + clock;
  return d.toLocaleDateString() + ", " + clock;
}

/* =======================================================================
   HUMAN VIEW: a run identifier. See docs/api/CONSOLE_LANGUAGE.md "A run
   identifier": named from files[0] (+ "and N more" for task=review, or
   from `question` (truncated ~60 chars) for task=draft, plus submitted_at,
   with run_id kept as a small secondary identifier beside it. Available
   from submission: files/question/submitted_at are already part of
   _STATUS_FIELDS and already returned by GET /runs and GET /runs/{run_id}
   in every state including queued (server.py:438, /submit ~1405-1419).
======================================================================= */
var MONTH_NAMES = ["January", "February", "March", "April", "May", "June",
                    "July", "August", "September", "October", "November", "December"];

function formatSubmittedAt(iso) {
  if (!iso) return "";
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  var hh = d.getHours(), mm = d.getMinutes();
  return d.getDate() + " " + MONTH_NAMES[d.getMonth()] + " " + d.getFullYear() + ", " +
    (hh < 10 ? "0" + hh : hh) + ":" + (mm < 10 ? "0" + mm : mm);
}

function runFriendlyTitle(run) {
  var files = run.files || [];
  if (files.length > 0) {
    return files.length > 1
      ? (files[0] + " and " + (files.length - 1) + " more")
      : files[0];
  }
  if (run.question) {
    var q = run.question;
    return q.length > 60 ? (q.slice(0, 60) + "…") : q;
  }
  return run.run_id;
}

/* Full "{name}, submitted {date}" plus the run_id as a small secondary
   identifier, as inline HTML (escaped). `compact` renders it for a tight
   row (run list) rather than the detail header. */
function runDisplayNameHtml(run, compact) {
  var title = runFriendlyTitle(run);
  var when = formatSubmittedAt(run.submitted_at);
  var sizeStyle = compact ? "" : ' style="font-size:1.05rem"';
  return '<span' + sizeStyle + '>' + escapeHtml(title) +
    (when ? ', submitted ' + escapeHtml(when) : '') + '</span> ' +
    mutedParen(run.run_id);
}

function renderListError(res) {
  document.getElementById("run-list-body").innerHTML =
    '<div class="notice error">Could not load runs (' + (res.status || "network error") + '). ' + escapeHtml(detailText(res.body)) + '</div>';

function applyListFilter() {
  var stateF = document.getElementById("f-state").value;
  var taskF = document.getElementById("f-task").value;
  var searchF = document.getElementById("f-search").value.trim().toLowerCase();
  var rows = lastRunsFetch.filter(function (r) {
    if (stateF && r.state !== stateF) return false;
    if (taskF && r.task !== taskF) return false;
    if (searchF && r.run_id.toLowerCase().indexOf(searchF) === -1) return false;
    return true;
  });
  var body = document.getElementById("run-list-body");
  if (lastRunsFetch.length === 0) {
    body.innerHTML = '<div class="empty-state">No runs yet. Submit documents to start a review, or a question to start a draft.</div>';
    return;
  }
  if (rows.length === 0) {
    body.innerHTML = '<div class="empty-state">No runs match this filter.</div>';
    return;
  }
  var human = isHumanView();
  body.innerHTML = '<div class="run-list">' + rows.map(function (r) {
    var tok = stateToken(r.state, r.outcome);
    var firstCell = human
      ? '<span class="title-cell">' + escapeHtml(runFriendlyTitle(r)) +
        '<span class="rid-secondary muted mono">' + escapeHtml(r.run_id) + '</span></span>'
      : '<span class="rid">' + escapeHtml(r.run_id) + '</span>';
    return (
      '<a class="run-row' + (human ? " human" : "") + '" href="#/runs/' + encodeURIComponent(r.run_id) + '">' +
        firstCell +
        '<span class="state tone-' + tok.tone + '">' + stateDotHtml(tok) + '<span>' + escapeHtml(tok.label) + '</span></span>' +
        '<span class="task">' + escapeHtml(r.task || "") + '</span>' +
        '<span class="when">' + escapeHtml(relativeWhen(r.submitted_at)) + '</span>' +
      '</a>'
    );
  }).join("") + '</div>';
}
